[project]
name = "mho900-lab-workspace"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["mho-evidence", "mho-lab-cli", "mho-transport", "mho-capture", "mho-scpi", "mho-review", "mho-adb"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/mho-evidence", "packages/mho-lab-cli", "packages/mho-transport", "packages/mho-capture", "packages/mho-scpi", "packages/mho-review", "packages/mho-adb"]

[tool.uv.sources]
mho-evidence = { workspace = true }
mho-lab-cli = { workspace = true }
mho-transport = { workspace = true }
mho-capture = { workspace = true }
mho-scpi = { workspace = true }
mho-review = { workspace = true }
mho-adb = { workspace = true }

[dependency-groups]
build = ["hatchling==1.32.4"]
dev = ["mypy>=1.15,<2", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/*/src"]
include = ["packages/**/*.py", "pyproject.toml", "packages/*/pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_any_explicit = true
disallow_any_unimported = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["packages/mho-evidence/src", "packages/mho-evidence/tests", "packages/mho-lab-cli/src", "packages/mho-lab-cli/tests", "packages/mho-transport/src", "packages/mho-transport/tests", "packages/mho-capture/src", "packages/mho-capture/tests", "packages/mho-scpi/src", "packages/mho-scpi/tests", "packages/mho-review/src", "packages/mho-review/tests", "packages/mho-adb/src", "packages/mho-adb/tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["packages/mho-evidence/tests", "packages/mho-lab-cli/tests", "packages/mho-transport/tests", "packages/mho-capture/tests", "packages/mho-scpi/tests", "packages/mho-review/tests", "packages/mho-adb/tests"]
addopts = "--strict-config --strict-markers"
