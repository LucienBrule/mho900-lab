[project]
name = "mho-review"
version = "0.1.0"
description = "Offline composition of sealed capture and SCPI evidence"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11,<3", "mho-evidence==0.1.0", "mho-transport==0.1.0", "mho-scpi==0.1.0"]

[tool.uv.sources]
mho-evidence = { workspace = true }
mho-transport = { workspace = true }
mho-scpi = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"
