[index_formula]
bucket = "low4((((u32(channel_delay[channel])*0x10624dd3)>>38)+120000)*0x10624dd3>>36)"
factor = "1 for 4GHz, 2 for 2GHz, 4 for 1GHz"
outer = "0 .. (16/factor)-1"
inner = "0 .. factor-1"
s = "signed_mod16(bucket + factor*outer)"
parity = "signed_mod2(s+16)"
half = "signed_mod8(trunc_toward_zero((s+16)/2))"
cell = "delay_map[half] + 8*parity"
lane = "lane_permutation[outer + (16/factor)*inner]"
matrix_address = "adc + 0x4eb4 + mode*0xe40 + vertical_scale*0xc0 + cell*4 + selected_field"
calls_per_supported_path = 48

