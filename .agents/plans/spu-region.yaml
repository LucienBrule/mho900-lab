contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.hardware.spu-transcript
    title: Derive the complete SPU candidate and software selection schema
    state: open
    intent: Recover eight SPU writes and pin the writable inputs that select their operands.
    requires: [TASK.hardware.adc-loop-decision]
    requirements:
      - Pin the unchanged stock ELF, function ranges, encoded instructions and relocations supporting all eight writes and both independent sample-mode selectors.
      - Use typed Kotlin tooling and TOML evidence to derive a fixed candidate from domain8 series900 record2 count16 modes1and4 and checkpoint shadows control1 gain0 TX0 ADC-control0.
      - Label control1 as post-first-bitset state; do not infer pre-SPU control uniquely.
      - Define bounded repeated capture of globals, all nine selection records, selected sample records0/1/15, bindings and shadows with exact comparison and immediate rejection on mismatch.
      - Preserve the validated ADC input protocol and fixtures; independently verify candidate operands and capture addresses without running a guest.
    acceptance: [Deterministic candidate and capture contract are independently checked and committed and pushed before observer implementation.]
    verification: [provenance, derivation, schema]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.guest.spu-region-control
    title: Validate a bounded eight-write SPU observer with private controls
    state: open
    intent: Extend the validated ADC observer to reject divergence across the entire SPU region.
    requires: [TASK.hardware.spu-transcript]
    requirements:
      - Retain two existing reads and the exact452 ADC writes; add only the admitted eight SPU writes after live-input validation.
      - Require the pinned software selection and repeated snapshots; do not adapt the candidate to unexpected live inputs.
      - Preserve main-thread PC/opcode width offset value order guards, PC-only advancement, traced group coverage, deadlines and exact cleanup.
      - Test complete sequence and negative selector pointer count binding shadow changed-snapshot operand order offset width thread and exhaustion cases with an independent verifier.
      - Capture terminal SPU shadows and the next uncompleted access; no new device read responses or side effects.
      - Preserve stock APK and library, guest system_server and enforcement; record limitations and negative outcomes without iterative run modification.
    acceptance: [Private-control conclusion and exact executable hash are committed and pushed before stock execution.]
    verification: [controls, rejection, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.hardware.stock-spu-region
    title: Falsify the complete SPU prediction in stock Sparrow
    state: open
    intent: Validate software-selected SPU initialization and identify the next unsatisfied boundary.
    requires: [TASK.guest.spu-region-control]
    requirements:
      - Run one fresh disposable guest using the privately tested executable and pinned inputs against unchanged stock artifacts.
      - Validate452 ADC writes then all eight SPU writes with live selection evidence; stop on first mismatch or next access without adaptation.
      - Independently verify raw software inputs, exact accesses, register preservation, terminal shadows, thread coverage and cleanup.
      - Distinguish static predictions, runtime software state, synthetic write acceptance and uncompleted accesses; make no FPGA acceptance or useful UI claim without evidence.
    acceptance: [A reproducible positive or negative conclusion is committed and pushed before successor execution.]
    verification: [inputs, sequence, boundary, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.hardware.spu-region-decision
    title: Select the next initialization region or ambiguity after SPU
    state: open
    intent: Use static recovery and observed divergence to choose the smallest useful successor.
    requires: [TASK.hardware.stock-spu-region]
    requirements:
      - Evaluate SPU selector and operand agreement without treating image defaults or synthetic acceptance as hardware behavior.
      - Consider WPU SCU UART GD32 and LA as a region with explicit mutable inputs and transport boundaries, not one experiment per deterministic store.
      - Recover any intervening read or transport consumer before introducing another synthetic response; replan explicitly on mismatch.
    acceptance: [Justify and admit a bounded successor or report a concrete blocker; commit and push before another experiment.]
    verification: [evaluation, continuation]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
