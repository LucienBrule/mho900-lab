contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.rf.transport-deregistration-preparation
    title: Prepare an explicit local transport removal gate before reconnect
    state: open
    intent: Test the asynchronous removal hypothesis exposed by the preserved reconnect timeout.
    requires: [TASK.rf.epoch-transport-decision]
    requirements:
      - Preserve and independently review the sealed reconnect timeout. Recover the exact disconnect/connect/status chronology, TCP handshake and host closure, absent application payload, recorder statistics and host restoration. Do not infer a scope reboot or root cause from local offline state.
      - Preserve v3 and prepare a separate minimal adapter with exactly one peer disconnect, bounded local inventory observation until that exact peer is absent, exactly one peer connect, then bounded local inventory observation until the unique peer is device. Retain the original twenty-second total deadline and stop on ambiguity, unexpected state or failure. No epoch read occurs until both local gates pass.
      - Preserve exclusive call intents, outputs and phase-specific result evidence. Retain the unchanged single process metadata read, mapping checks, original impedance normalization/restoration, lease/isolation, source schedule and all waveform/numerical rules. No daemon restart, root request, physical reboot or specimen setting belongs to the transport adapter.
      - Validate delayed removal, immediate removal, failed removal, duplicate peer, premature connect and readiness timeout with deterministic host-only controls. Independently review actual concrete preparation and the corresponding minimal completed-arm verifier adaptation. No physical execution belongs to this preparation.
    acceptance: [The asynchronous-removal hypothesis is prepared for a bounded test or a hold is recorded.]
    verification: [stop_evidence, adaptation, controls, concrete_review]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.rf.transport-deregistration-decision
    title: Evaluate local removal gating before a fresh RF arm attempt
    state: open
    intent: Branch from the completed reconnect question without extending its timeout or weakening an RF guard.
    requires: [TASK.rf.transport-deregistration-preparation]
    requirements:
      - Record GO or HOLD from the actual sealed stop, packet and local-status chronology, bounded removal gate, source differences and independent review. Treat awaiting removal as a new local transport hypothesis, not evidence of its success.
      - Commit and push the previous conclusion, tasking and decision before execution. The frozen matched RF contract and hard deadline2026-10-03T01:38:03Z remain unchanged. Stop rather than retry a metadata or waveform read; retain every attempt and avoid adding samples to obtain a desired contrast.
    acceptance: [A reasoned removal-gate GO or HOLD resolves the readiness question.]
    verification: [decision, preservation, execution_boundary]
    required_extensions: []
    extensions: {}
