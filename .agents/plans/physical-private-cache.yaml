contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.specimen.physical-private-cache
    title: Preserve one bounded physical private-cache observation
    state: open
    intent: Observe stock Setup ownership and both private caches without executing save or accessing FRAM.
    requires: [TASK.specimen.private-cache-observer-decision]
    requirements:
      - Freeze the validated reader and physical capture/host-isolation wrapper; require fresh full Layer Two capture with graceful shutdown and drop statistics, isolated address and no gateway/DNS/forwarding/NAT/bridge.
      - Use the existing isolated six-hour lease and authenticated ADB only. Verify current root identity without another root attempt, exact live Sparrow APK pin, PID/start-time and boot identity before helper staging.
      - Stage one hash-verified helper and execute its positive profile once. No target attachment, calls, memory writes, device IO, option install, reboot or capability change. Helper/evidence staging is an explicit filesystem write.
      - Preserve raw and partial evidence on any result. Stop on unexpected network, UI, process, mapping, observer or recorder behavior; do not adapt or retry against the specimen inside this task.
      - Independently reconstruct the ownership/read transcript if accepted, decode streams privately, and distinguish cache equality from physical FRAM durability. Restore temporary host addressing, disconnect ADB, stop lease responder and seal all artifacts.
    acceptance: [One physical observation or precisely preserved stop has a bounded evidence-backed result.]
    verification: [preflight, observation, network, restoration, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.specimen.physical-private-cache-decision
    title: Reconcile physical cache evidence and remaining FRAM question
    state: open
    intent: Determine whether current software private state was captured and identify the remaining stored-state gap.
    requires: [TASK.specimen.physical-private-cache]
    requirements:
      - Compare only observed representations; do not call an in-memory stream a FRAM backup. If the reader rejects, inspect the exact stopped boundary offline before proposing any new physical operation.
      - State the next smallest bench question and preserve any blocker. Commit and push results; this decision does not itself install an option or reboot/change capabilities.
    acceptance: [The acquired evidence and next boundary are explicit.]
    verification: [finding, limits, continuation]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
