contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.rf.raw-format-oracle-preparation
    title: Prepare a supplied-byte WORD and ASCII readout oracle
    state: open
    intent: Make the next stopped-format question testable without another physical acquisition.
    requires: [TASK.rf.stock-raw-semantics-decision]
    requirements:
      - Bind the independently reviewed stock export recovery, Java boundary and all twenty paired diagnostic positions. Work only in a fresh ignored output root with preserved originals and existing offline tools.
      - Separate documented binary framing, directly recovered byte order and conversion arithmetic, supplied coherent gain/reference values, and unresolved device snapshot semantics. Inspect the preserved official programming guide for WORD framing; preserve its exact hash and page witnesses. An unresolved framing boundary is a valid stopped preparation rather than a guessed protocol.
      - Compose a narrow strongly typed supplied-byte decoder and conversion oracle if the witnesses support it. Preserve original WORD bytes separately from derived volts. Model the recovered single-precision conversion and decimal formatter explicitly; rounded preamble gain must not be promoted to the exact hidden float coefficient. No host implementation or synthetic fixture is stock execution or a physical snapshot witness.
      - Independently verify meaningful boundary controls for payload length, framing, endianness, signed reference arithmetic and rounding using a separate implementation or compiler where available. Preserve rejection and incomplete outcomes. Do not change the public ASCII parser, receive rules, original RMS reducer or comparison contract.
      - Draft the exact next WORD-before, ASCII, WORD-after stopped-record question, including geometry, format restoration, no intervening RUN, raw preservation and falsification. Do not execute it or contact any endpoint. No SSH, ADB, SCPI, DHCP, capture, serial, guest, physical transition, native or protected-state change is part of preparation.
    acceptance: [A supplied-byte oracle and independently checked controls or an exact unresolved preparation boundary is preserved.]
    required_extensions: []
    extensions: {}
    verification: [inputs, protocol, typed_oracle, controls, independent_review]
  - protocol: tasking/core-draft-2
    id: TASK.rf.raw-format-oracle-decision
    title: Evaluate the stopped-format bench proposal and checkpoint
    state: open
    intent: Leave a precise next test without inferring an unmeasured RF policy result.
    requires: [TASK.rf.raw-format-oracle-preparation]
    requirements:
      - Evaluate the independently reviewed supplied-byte preparation against the actual failed A1 and equal paired-export observations. State exactly which result would reveal readout or scaling disagreement and which source, acquisition and hardware-generation questions remain unresolved.
      - Retain all twenty paired positions, the failed original A1, fifty missing B/A2 slots and the unchanged seventy-five-slot comparison. Do not admit physical execution or a native transition from this offline decision.
      - Complete the tighter current authorization window with durable immutable evidence, known-safe restored ordinary and isolated host state, absent owned helpers and a clean committed and pushed checkout. Record a new physical window, wiring or independent source reference as an explicit dependency when required.
    acceptance: [A concrete independently reviewable next bench proposal or exact preparation blocker and clean checkpoint are durable.]
    required_extensions: []
    extensions: {}
    verification: [independent_review, falsification, remaining_boundaries, checkpoint]
