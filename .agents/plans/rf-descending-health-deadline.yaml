contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.rf.descending-health-deadline
    title: Align the native health constructor with the admitted finite deadline
    state: open
    intent: Resolve the stopped host bootstrap without changing the RF or native experiment.
    requires: [TASK.rf.descending-completion-budget]
    requirements:
      - Preserve the stopped derived launch and its original stale-bound exception. Retire only positively identified capture and DHCP owners, preserving graceful child closure and capture statistics; do not invent the unavailable original supervisor wait status. No ADB session, native change, reboot or RF command occurred in that bootstrap.
      - Change only the stale HealthConfig deadline validation bound to the already admitted conservative Linux deadline. Inspect other constructor bounds and exercise the actual concrete health fields with explicitly synthetic named owners in a pure control. Preserve the original failing constructor and prove unaffected methods and limits remain unchanged.
      - Bind a fresh derived run identity and source directory, exact changed runtime and configuration pins. Preserve the 3000-second leg cap, 1801-second serviced warm-up, 7320-second pre-deployment reserve, one normal reboot, final stock restoration and actual lease evidence. Do not modify an earlier sealed configuration or runtime.
    acceptance: [The concrete future bootstrap accepts the admitted timing fixture without weakening another boundary.]
    required_extensions: []
    extensions: {}
    verification: [stopped_evidence, exact_bound_diff, constructor_control, concrete_bindings]
  - protocol: tasking/core-draft-2
    id: TASK.rf.descending-health-deadline-decision
    title: Evaluate the corrected native deadline boundary before a fresh transition
    state: open
    intent: Decide whether the same authorized derived experiment can continue from its preserved stock predecessor.
    requires: [TASK.rf.descending-health-deadline]
    requirements:
      - Independently inspect the actual stopped artifacts, positive helper ownership and closure, exact source difference, concrete constructor control and fresh typed bindings. Preserve the earlier conditional review and identify the missed dynamically constructed HealthConfig check.
      - Proceed only after the stock RF conclusion is sealed and committed, this correction is independently accepted and committed and pushed, and the remaining reserve still meets 7320 seconds. Reuse no stopped run identity and infer no new lease, process owner or native result from pure controls.
      - The continuation is the same bounded derived native transition and descending survey already admitted. No extra reboot, alternate native bytes, changed RF schedule or broader physical action is admitted by this decision. Stop with an exact remaining question if the corrected boundary is not supported.
    acceptance: [A concrete evidence-backed continuation or exact stop condition is recorded.]
    required_extensions: []
    extensions: {}
    verification: [independent_review, unchanged_scope, continuation]
