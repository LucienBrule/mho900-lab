contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.rf.policy-filter-static
    title: Reconcile exact stock bandwidth policy with the RF contrast
    state: open
    intent: Recover which software signal-path selections distinguish enums17 and18 before a physical policy comparison.
    requires: [TASK.rf.limiter-control-decision]
    requirements:
      - Rehash the preserved stock ELF and pin symbol/data provenance before analysis. Reconcile prior local three-way findings against the exact stock ancestor used by the specimen-derived experiment, preserving older artifacts and stock bytes.
      - Recover enum17/18 selections in UpdateBandLimit and SetBandLimit under declared4GSa/s normal acquisition and50-ohm conditions; trace analog tuple sources, digital filter IDs and coefficient payload identity, cache checks and scale/offset refresh. Distinguish constructor defaults, persisted calibration, runtime selectors and unestablished native scale/channel-mode units.
      - Use static-first recovery and only bounded offline instruction execution where ambiguity requires it. Do not rerun an exhaustive old matrix or contact any physical device. Pin exact controlled inputs/stubs and retain unexpanded dependencies; a predicted software selection is not a live hardware witness.
      - Produce a sanitized TOML contract and report relating verified software differences to the proposed RF contrast, with exact remaining bench questions. Independently check important instruction/table claims and changed-evidence controls; commit and push the bounded result or precise unresolved boundary.
    acceptance: [Exact software selection evidence or its bounded unresolved inputs inform the next comparison without promoting static or synthetic behavior into physical validation.]
    verification: [provenance, dispatch, analog, digital, runtime_limits, controls, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.rf.policy-filter-decision
    title: Evaluate policy mechanism and reconcile RF readiness
    state: open
    intent: Decide whether verified software selections refine the held physical comparison or expose another bounded prerequisite.
    requires: [TASK.rf.policy-filter-static]
    requirements:
      - Independently assess the exact stock provenance, dispatch/tuple/filter evidence and runtime limitations; retain the distinction between source recovery, bounded execution and real instrument behavior.
      - Reconcile the proposed contrast and bench questions without authorizing or executing software transitions. Keep TASK.rf.execution-decision open unless its separate physical authorization and readiness contract is actually satisfied.
      - Preserve local evidence, commit and push conclusions, and leave clean taskctl/Git state before the unattended deadline; no physical contact in this batch.
    acceptance: [A bounded decision states what mechanism is established and the next smallest physical or offline observation still required.]
    verification: [review, reconciliation, limits, preservation, next_question]
    required_extensions: []
    extensions: {}
