tasks:
  - {"protocol": "tasking/core-draft-2", "id": "TASK.rf.stable-stock-preparation", "title": "Prepare stock continuation after observed UI startup", "state": "open", "intent": "Observe the already running stock epoch without another reset or software transition.", "requires": ["TASK.rf.confirmed-stock-decision"], "requirements": ["Bind sealed actual recovery and independent result: one confirmed normal cycle, fresh captured isolated 86400-second lease, successful initial ADB and one root restart, exact stock APK-backed native mapping and protected baseline. Preserve the early spinner image and supervisor stop; do not label that image normal or claim completed warm-up/policy/RF.", "Create a separate exclusive same-boot continuation from the pinned recovery executor, retaining owned V5 ADB lifetime and stock/protected callbacks. Explicitly prohibit another physical transition, reboot, root restart, remount, property/native/source/settings change. One bounded new connection follows proved successful prior connection and full retirement; UID must already be root. Bind the exact previously observed boot identity, PID/start time and current protected baseline from sealed local evidence.", "Independently validate the recorded lease against immutable raw REQUEST/ACK rather than reuse older lease authority or force renewal. Fresh full capture and isolation precede host addressing. Existing lease is valid only within its actual expiry; ordinary same-client renewals may be serviced with86400seconds and no gateway/DNS. No extra DHCP transition or operator cable action.", "Request the initial normal UI screenshot only after the operator has reported current UI up, and bind the single new image to unchanged stock epoch. Retain explicit normal-UI review, serviced1801second warm-up, final UI and one fixed16-byte17/17 observation. On spinner, prompt, mismatch or ambiguity stop; no overwrite/retry.", "Use strong typed validation for authored configuration and targeted controls for changed lease/same-epoch/no-transition gates. Reuse unchanged tests and exact dependencies, inspect concrete proposed mutation, commit/push before execution; independent review exact assembled source. Frozen75-slot RF protocol and2026-10-03T01:38:03Z deadline/reserve unchanged."], "acceptance": ["A concrete same-boot coordinator is independently reviewed and frozen or explicitly held."], "required_extensions": [], "extensions": {}, "verification": ["authority", "source", "controls", "preservation"]}
  - {"protocol": "tasking/core-draft-2", "id": "TASK.rf.stable-stock-observation", "title": "Observe stable stock without another power cycle", "state": "open", "intent": "Complete native stock readiness in the existing confirmed boot.", "requires": ["TASK.rf.stable-stock-preparation"], "requirements": ["Execute only the frozen fresh continuation with new capture and verified isolation. Use preserved actual lease authority plus one owned bounded ADB connection; require UID0 and exact boot/PID/start/mapping before accepting any current state. No reboot/root request or physical intervention.", "Preserve initial and final protected archives/status, exact APK/native hashes, two single current UI witnesses, serviced1801second warm-up and one16byte stock17/17 observation. No RF records, source commands or acquisition settings changes in this task. Stop rather than retry any failed gate.", "Gracefully retire owned sockets/server before alias removal and capture/helper with preserved drop statistics. Seal raw capture and all evidence; independently verify exact recorded state and restoration."], "acceptance": ["One successful or explicitly stopped same-boot continuation is sealed without retry."], "required_extensions": [], "extensions": {}, "verification": ["epoch_lease", "stock_ui_policy", "preservation", "capture_restoration"]}
  - {"protocol": "tasking/core-draft-2", "id": "TASK.rf.stable-stock-decision", "title": "Evaluate current stock readiness for fixed RF comparison", "state": "open", "intent": "Release RF execution only from accepted current native and physical evidence.", "requires": ["TASK.rf.stable-stock-observation"], "requirements": ["Independently assess exact recorded lease, unchanged stock epoch/mapping/protected data, current normal UI,17/17 and serviced warm-up, recorder and owned retirement. Preparation or operator normal UI alone is not ArmReady.", "If accepted, produce fresh evidence-bound ArmReady and explicitly reconcile original acquire/reduce/determination inputs before RF. Preserve original75slots/numerical rules/deadline and known-safe restoration. If held, state exact missing evidence without another reset/connect experiment.", "Commit/push conclusion before next experiment."], "acceptance": ["A reasoned GO or HOLD decision binds actual evidence."], "required_extensions": [], "extensions": {}, "verification": ["independent_result", "arm_readiness", "continuation"]}
