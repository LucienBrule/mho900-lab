contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.bench.option-status-six-hour-arm
    title: Arm six-hour isolated lease and explicit link refresh
    state: open
    intent: Prepare the operator-requested Ethernet reconnect under fresh capture.
    requires: [TASK.bench.option-status-decision]
    requirements:
      - Preserve prior failed evidence; create a separate run with fresh host baseline.
      - Change only the single-client lease duration to 21600 seconds. Retain no gateway, DNS, forwarding, sharing, NAT or bridge.
      - Retain frozen read-only identity and eleven option queries; gate them on operator reconnect confirmation and captured valid ACK.
      - Verify offline lease shape and duration, supervisor syntax, and current isolation. Commit and push preparation before arming.
      - Start full capture and responder before telling the operator to reconnect Ethernet. Record the explicit transition on confirmation; do not request other cable or control changes.
    acceptance: [Capture and six-hour single-client responder are healthy before the operator transition.]
    verification: [preparation, isolation, capture, limits]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.bench.option-status-six-hour-observe
    title: Observe reconnect and read-only option baseline
    state: open
    intent: Obtain the already-authorized baseline after the explicit link refresh.
    requires: [TASK.bench.option-status-six-hour-arm]
    requirements:
      - Wait for operator confirmation of Ethernet reconnect; retain carrier and DHCP evidence.
      - Require captured ACK with21600second lease for the known client and no gateway/DNS before source-bound TCP5555.
      - Execute the frozen twelve queries once; no retries, ADB, USB, Web Control, installation, reboot or capability change.
      - Stop on unexpected traffic, identity, response or recorder failure. Preserve graceful drop statistics and restore temporary host state.
      - Seal evidence, independently verify the actual result, commit and push.
    acceptance: [A verified baseline or exact stop condition is preserved.]
    verification: [transition, lease, observation, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.bench.option-status-six-hour-decision
    title: Evaluate six-hour lease and physical option evidence
    state: open
    intent: Reconcile actual network and option facts without attributing an unproven cause.
    requires: [TASK.bench.option-status-six-hour-observe]
    requirements:
      - Distinguish the combined link-refresh and lease-duration intervention from a proven DHCP root cause.
      - Keep native built-ins and cached bandwidth distinct from documented SCPI states.
      - Record the next bounded question and commit/push the conclusion.
    acceptance: [The result and remaining uncertainties are explicit.]
    verification: [finding, limits, continuation]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
