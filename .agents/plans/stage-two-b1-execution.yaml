contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.bench.stage-two-b1-idn
    title: Execute authorized single SCPI identity checkpoint
    state: open
    intent: Capture one bounded identity exchange under isolated host networking, then restore temporary host state.
    requires: [TASK.bench.scpi-endpoint-decision]
    requirements:
      - Admit and commit tasking before execution. Preserve a new private run and baseline; verify interface identity, lease lifetime, normal default route and no forwarding, sharing, NAT, bridging or DHCP service.
      - Start and verify a fresh full Ethernet capture through the corrected recorder before assigning the temporary host address. Stop on recorder failure, unexpected traffic, UI prompt or isolation change.
      - Under healthy capture assign only the isolated temporary host address. Make at most one interface-bound TCP connection to the leased specimen on port 5555 and send exactly one LF-terminated *IDN? query, with bounded deadlines and no retry.
      - Preserve raw request and response and exact identity fields privately. No option query, Web Control, ADB, USB, discovery, scans, lease renewal or device configuration.
      - Remove only the temporary host address under capture, stop gracefully with drop statistics, verify restoration and seal artifacts and hashes. A failed prerequisite or negative attempt is valid evidence; do not broaden the run.
    acceptance: [One bounded result or preflight stop is preserved with explicit limits and restoration evidence.]
    verification: [authorization, preflight, exchange, recorder, restoration]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.bench.stage-two-b1-reconcile
    title: Reconcile first physical identity with the firmware corpus
    state: open
    intent: Compare observed identity text with local firmware provenance without making another specimen request.
    requires: [TASK.bench.stage-two-b1-idn]
    requirements:
      - Preserve exact raw response privately and distinguish reported version from artifact byte identity; handle a negative result without inventing fields.
      - Record a redacted conclusion and remaining uncertainty, commit and push evidence and task state, then stop for operator review.
      - No further physical operation or successor physical task admission.
    acceptance: [The identity result is reconciled offline and the authorization boundary remains closed.]
    verification: [identity, corpus, decision]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
