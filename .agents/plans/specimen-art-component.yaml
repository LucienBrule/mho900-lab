contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.specimen.art-component
    title: Construct stock services under a real ART and JNI caller
    state: open
    intent: Correct the proven missing Java VM prerequisite using the unchanged specimen API class and stock native library.
    requires: [TASK.specimen.factory-fault-decision]
    requirements:
      - Commit and push tasking before execution. Preserve earlier native-only failures and all specimen input hashes.
      - Build a small app_process host using the unchanged APK classpath and native libraries. Let ordinary Java loading establish JNI_OnLoad; do not fabricate JavaVM pointers or replace native constructors.
      - Recover the API class notification dependencies and validate loader readiness before the stock call. Keep stock notification behavior where available; stop on an unsatisfied Android prerequisite rather than invent success.
      - Perform one stock factory and identity-boundary run after host readiness. Require a real service inventory or a precise new failure; stop at DNA, FRAM or unexpected hardware initialization.
      - Retain durable journal, host records, file deltas, pinned tool/input manifests and guest health. No option installation or D redirect in this baseline; no physical contact.
    acceptance: [The actual ART caller permits stock construction or identifies a precise remaining prerequisite.]
    verification: [caller, stock, evidence, limits]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.specimen.art-component-decision
    title: Choose the coherent guest entitlement fixture
    state: open
    intent: Evaluate the ART baseline and admit a bounded ordinary-install fixture or another useful offline continuation.
    requires: [TASK.specimen.art-component]
    requirements:
      - Separate actual stock behavior from synthetic DNA and private-store state; never claim the missing physical FRAM was acquired.
      - Prioritize an ordinary installer and persistence witness over unrelated startup recovery. Define before, after, process-restart and guest-reboot observations when the fixture is coherent.
      - Keep capability redirection separate. Plan, inspect, admit at expected revision, commit and push before successor execution. Preserve exact bench questions without physical contact.
    acceptance: [A bounded next offline task is admitted from the actual result or an exact blocker is recorded.]
    verification: [finding, continuation, boundaries]
    required_extensions: []
    extensions: {}
