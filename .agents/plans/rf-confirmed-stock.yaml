contract: taskctl.seed/alpha1
tasks:
  - {"protocol": "tasking/core-draft-2", "id": "TASK.rf.confirmed-stock-preparation", "title": "Prepare fresh stock recovery with confirmed operator presence", "state": "open", "intent": "Test a fresh stock boot after the completed negative ADB session without changing software selection.", "requires": ["TASK.rf.stock-recovery-decision"], "requirements": ["The operator is now awake and explicitly confirms that the scope stayed powered on with normal UI, no Shutdown and no setup change. The approved single manual cycle is therefore unused. Preserve the completed confirmation timeout as immutable evidence. Reuse the exact reviewed generator and control modules, changing only fresh run identity and regenerated provenance/inventory. Validate the new concrete binding independently; do not repeat numerical or unchanged transport research. Commit and push before arming.", "Bind the operator authorization for one manual scope power cycle and current report that the normal scope UI displays RF on CH1. This is an operator observation, not a PID-bound native or waveform witness. Preserve all five prerequisite-only failures and the responsive one-query SCPI diagnostic.", "Prepare a separate fresh full-capture and isolated 86400-second DHCP coordinator. Positively identify owned processes and freeze exact control sources. Before the operator transition confirmation, provide no management connection and no temporary host IPv4 address. Publish readiness only after host isolation, actual capture writing and graceful recorder control are verified. Never infer a power cycle from silence or link activity.", "Require one explicit normal power cycle in two operator-confirmed steps: normal shutdown with screen-dark confirmation, then a durable power-on-ready cue and one start confirmation. Require a fresh matching DHCP REQUEST/ACK after the power-on-ready cue before postboot observation; that ACK may precede the operator reply. Never mistake confirmation-message latency for missing negotiation. Permit an expected old-lease release only within the explicit transition window before that new ACK. No DHCP gateway, DNS, forwarding, NAT, bridge or external route. No source command, new wiring, native deployment/removal, firmware flash, entitlement or calibration operation.", "Reuse the proved foreground owned ADB lifetime, precise library/mapping/epoch checks, protected-content comparison and existing fixed stock observer. Bound one initial connection; if service health fails, stop without another reset or unchanged connect retry. Permit at most the original single bounded postboot adb-root setup if a verified shell UID requires it for the existing observer; record intent and daemon restart, verify UID afterward, and never remount or change persistent daemon properties. After that sole recorded daemon restart, permit exactly one separately bounded post-root disconnect/absence/connect/readiness sequence using the reviewed V5 adapter, with no second root request or repeated connect. Check the owned server identity/liveness before every retained ADB CLI invocation; any uncertainty stops with contained cleanup.", "Keep exact stock hashes, current protected baseline, new boot/process identity, stock 17/17 witness, current normal UI acceptance and greater than 1800 seconds serviced warm-up. Independently review deterministic gates, exact source, lease chronology and cleanup before root executes. Plan and commit preparation before physical contact. Retain the original RF contract and hard deadline 2026-10-03T01:38:03Z with sufficient remaining-sequence reserve."], "acceptance": ["One independently reviewed recovery coordinator is frozen or explicitly held."], "required_extensions": [], "extensions": {}, "verification": ["authority", "source", "controls", "preservation"]}
  - {"protocol": "tasking/core-draft-2", "id": "TASK.rf.confirmed-stock-observation", "title": "Observe the confirmed unused stock power cycle", "state": "open", "intent": "Determine whether a fresh ordinary boot restores the native verification path while preserving the specimen corpus.", "requires": ["TASK.rf.confirmed-stock-preparation"], "requirements": ["Use a fresh exclusive run and current cues only. The prior coordinator is completed and must not be restarted. The operator has confirmed no prior physical cycle; exactly one normal Shutdown/start is authorized here. Never reuse expired tokens or historical lease authority.", "Commit and push reviewed preparation before arming capture and asking the operator to power-cycle once. Preserve explicit capture readiness, screen-dark shutdown confirmation, power-on-ready cue and start confirmation with timestamps. Keep capture and lease observation healthy across both manual steps. Accept a new matching ACK after the power-on-ready cue even if it precedes the start-confirmation message; no automatic second reset, native change or reboot command.", "Capture actual new lease negotiation and verify one fresh postboot ADB session, stock APK/native mappings and hashes, changed boot identity, new process epoch and unchanged protected material. If root setup is needed, use only the preparation contract's single bounded branch. Stop on transport ambiguity, unexpected traffic, UI prompt, mapping or corpus mismatch.", "Bind a current normal UI witness to the fresh stock epoch, observe stock 17/17 through the established bounded reader and verify stability after greater than 1800 seconds serviced warm-up. Preserve immutable raw evidence, before/after host manifests, owned helper retirement before alias removal, graceful recorder/drop statistics and independently reviewed restoration. No RF record belongs to this recovery."], "acceptance": ["One successful or explicitly stopped recovery observation is sealed without a retry."], "required_extensions": [], "extensions": {}, "verification": ["transition", "fresh_stock", "preservation", "capture_restoration"]}
  - {"protocol": "tasking/core-draft-2", "id": "TASK.rf.confirmed-stock-decision", "title": "Evaluate the fresh confirmed stock recovery", "state": "open", "intent": "Release the fixed comparison only from actual fresh stock evidence or close the recovery with a precise stop.", "requires": ["TASK.rf.confirmed-stock-observation"], "requirements": ["Independently assess the operator-confirmed power cycle, fresh captured lease, unique stock process/boot/mapping/policy evidence, current normal UI, warm-up, protected corpus and host/capture closure. Neither responsive CH1 nor SCPI identity substitutes for native policy verification.", "If accepted, bind a fresh ArmReady projection to the immutable actual recovery and independent review; reconcile the original acquisition, reduction and determination inputs before admitting further execution. Keep all 75-slot acquisition and numerical criteria unchanged. On failure preserve the exact question answered, do not repeat reset or connect, and state the smallest next operator decision.", "Commit and push the conclusion before another experiment. Preserve original stock and derived bytes and the hard deadline; do not claim a recovered transport, preparation or synthetic control is an RF characterization result."], "acceptance": ["A reasoned recovery decision releases the original protocol or holds it with exact evidence."], "required_extensions": [], "extensions": {}, "verification": ["independent_result", "arm_readiness", "continuation"]}
