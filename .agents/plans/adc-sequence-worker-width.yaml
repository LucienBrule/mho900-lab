contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.guest.adc-sequence-worker-width
    title: Bind the worker-access checker to the compiled 32-bit instruction
    state: open
    intent: Correct the witnessed checker expectation while retaining the native experiment unchanged.
    requires: [TASK.guest.adc-sequence-stock-gate-02]
    requirements:
      - Preserve both earlier attempts and manifests. The second attempt remains a partial result with seven accepted arms and a frozen checker rejection on arm108.
      - Correct only the arm108 worker opcode expectation from the compiled ELF evidence. Retain thread identity, PC, mapped address, rejection-before-modeling and cleanup checks. Do not weaken inherited or other sequence checks.
      - Use independent copies of actual run02 evidence to replay accepted arms101..107 and arm108 under the corrected checker. Exercise targeted changed-opcode, leader-substitution, changed-address and cleanup corruptions on arm108. Bind the worker symbol and opcode to the unchanged compiled image.
      - Preserve native executable SHA256 960b91e1b3cd7de8f49d47833c6e13ec43afcc597bb0d205c379f471a2bcda37 and profile SHA256 1fd5ffcf09094da41bd7aa08ed60974b6a6f4c3be9ba7f0f92eebdab087d8abb. No observer or synthetic response change.
      - Freeze private-adc-sequence-03 with the corrected verifier and the same twelve arms. Commit and push the new manifest and offline control conclusions before guest execution.
    acceptance:
      - A compiled-image-grounded checker correction and a separately frozen private suite are verified and pushed, or a precise limitation is recorded.
    verification: [correction, controls, preservation, freeze]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.guest.adc-sequence-private-run-03
    title: Complete private ADC sequence controls with the corrected worker checker
    state: open
    intent: Obtain actual evidence for all frozen private controls without changing native behavior.
    requires: [TASK.guest.adc-sequence-worker-width]
    requirements:
      - Recheck the frozen inputs, stock preservation and capacity before exactly one fresh private-adc-sequence-03 attempt. Install no stock application and use the unchanged native executable and profile.
      - Execute the twelve arms with the frozen corrected verifier; stop on the first unexpected result. Preserve the original outcome without adaptation or retry.
      - Evaluate actual sequence, worker, read protocol, atomic, precise stop, thread and negative-control outcomes. Host replay is not evidence that previously unexecuted arms ran in the guest.
      - Audit system_server continuity, Enforcing, final health, index and teardown. Preserve and commit and push the positive or negative result before the next gate.
    acceptance: [One fresh frozen suite attempt has a precise preserved and pushed conclusion.]
    verification: [execution, controls, health, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.guest.adc-sequence-stock-gate-03
    title: Decide stock whole-sequence validation from completed private evidence
    state: open
    intent: Admit stock validation only after the remaining observer controls have actual guest evidence.
    requires: [TASK.guest.adc-sequence-private-run-03]
    requirements:
      - Distinguish original failed attempts, corrected offline replay and actual guest controls. Reconcile unexpected evidence before any continuation.
      - If all controls support it, admit a bounded stock validation of the full predicted ADC sequence with unchanged APK and library, the two explicit synthetic logging responses, full thread coverage and unexecuted post-return PC0x333bac. Include preparation and verification tasks as needed; no next-subsystem response is included.
      - Otherwise identify the smallest supported correction or limitation. Draft, plan, inspect and admit any successor against the current revision and commit and push before implementation.
    acceptance: [An evidence-supported bounded continuation or precise limitation is committed and pushed.]
    verification: [evaluation, continuation]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
