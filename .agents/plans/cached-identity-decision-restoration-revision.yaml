protocol: tasking/core-draft-2
id: TASK.specimen.cached-identity-reader-decision
title: Reconcile reader evidence and the next physical parity question
state: open
intent: Decide whether the helper is suitable for a separately authorized observation and preserve explicit remaining limits.
requires:
  - TASK.specimen.cached-identity-setup-restoration
requirements:
  - Evaluate addressing, repeated bytes, process lifetime and permission evidence separately. A guest pass cannot establish specimen permissions or initialized physical values.
  - State the smallest proposed future physical action, including any temporary helper staging, existing-credential requirement, maximum memory bytes and stop-on-denial rule. Do not execute it overnight.
  - If the control fails, close the actual question and admit a bounded successor only when justified. Otherwise release reporting; avoid repetitive synthetic permutations that cannot answer the physical parity question.
  - Commit and push the decision and any admitted successor before execution.
acceptance:
  - A bounded physical proposal or exact unresolved control dependency is recorded without specimen contact.
required_extensions: []
extensions: {}
verification:
  - finding
  - physical_boundary
  - continuation
