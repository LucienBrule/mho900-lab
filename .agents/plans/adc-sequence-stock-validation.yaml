contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.guest.adc-sequence-stock-freeze
    title: Prepare and freeze one stock whole-ADC-sequence validation
    state: open
    intent: Translate the qualified private observer into a bounded stock prediction test with complete evidence checks.
    requires: [TASK.guest.adc-sequence-stock-gate-03]
    requirements:
      - Preserve stock APK and native library hashes, native observer960b91e1 and profile1fd5ffcf. Reuse the validated stock calibration filesystem and narrow guest configuration; introduce no additional device response.
      - Integrate a distinct adcsequencemodel runner mode and stock-adc-sequence native command with explicit manifest and run identity. Stage and pin all source, static candidate, profile, native, filesystem and instrumentation inputs. Stop at unexecuted post-return relative PC0x333bac with opcode0x5285070a.
      - Resolve the witnessed local instrumentation interpreter prerequisite before freeze using a separately staged configurable project-local tool environment if required. Preserve earlier tool state, require the pinned server and client versions, and make no host policy or global interpreter changes. Verify local versions and dependencies without launching a guest.
      - Independently verify the inherited stock prefix, complete entry captures and175 guards,97 predicted writes and2 explicit synthetic reads, register transitions,33 final shadows, thread inventory and cleanup, and unexecuted final PC. Keep software-determined operations separate from modeled readbacks; no physical FPGA claim.
      - Exercise the stock checker using independent synthetic or replay-derived host fixtures with targeted corruption controls. Recheck production indexing, health routing and prerequisite checks for the new mode. Include every consumed file in the final indexed evidence audit and bind the audit to an externally pinned manifest digest.
      - Freeze exactly one stock-adc-sequence-01 attempt and commit and push preparation and host verification before execution. Unexpected architectural evidence is a decision event rather than an implicit scope expansion.
    acceptance: [A bounded stock validation and independent checker are verified and frozen before execution, or a precise limitation is recorded.]
    verification: [integration, checker, controls, preservation, freeze]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.guest.adc-sequence-stock-run
    title: Validate the predicted whole ADC sequence in stock Sparrow
    state: open
    intent: Falsify or support the complete static candidate in one bounded stock execution.
    requires: [TASK.guest.adc-sequence-stock-freeze]
    requirements:
      - Recheck the committed freeze, stock byte identity, tool readiness and capacity before exactly one fresh disposable guest run. No physical instrument access.
      - Run stock Sparrow and the stock native library through the99-access ADC candidate using only the2 frozen synthetic logging readbacks. Stop at the unexecuted caller checkpoint or the first unexpected event. Do not adapt or retry the frozen experiment.
      - Verify inherited evidence, captures, guards, values, register transitions, thread coverage, final shadows and precise terminal state. Any mismatch closes the actual question as a negative without weakening checks.
      - Verify system_server continuity, Enforcing, final health, full index and teardown. Preserve and commit and push the conclusion before the decision task.
    acceptance: [One frozen stock attempt produces a precise positive or negative preserved and pushed result.]
    verification: [execution, prediction, health, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.guest.adc-sequence-stock-decision
    title: Evaluate ADC validation and select the next unsatisfied initialization dependency
    state: open
    intent: Continue static-first subsystem recovery from the witnessed stock boundary.
    requires: [TASK.guest.adc-sequence-stock-run]
    requirements:
      - Compare static prediction and actual stock evidence; distinguish synthetic logging responses from software state and physical semantics. Preserve any negative result and reconcile before changes.
      - On success inspect the next stock initialization routine statically and identify externally unsatisfied reads, asynchronous state or environment dependencies. Do not resume into or supply responses for the next subsystem in this batch.
      - Draft a small evidence-supported successor batch or record a precise limitation. Run plan, inspect mutations, admit against the expected revision and commit and push tasking before execution.
    acceptance: [The stock prediction is evaluated and an evidence-supported bounded successor or limitation is committed and pushed.]
    verification: [evaluation, next_boundary, continuation]
    required_extensions: []
    extensions: {}
