contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.bench.cached-bandwidth-policy-bytes
    title: Validate bandwidth reader with host policy hashing
    state: open
    intent: Remove the unavailable guest utility dependency while retaining the exact bounded reader.
    requires: [TASK.bench.cached-bandwidth-control-decision]
    requirements:
      - Preserve failed run01 and exact compiled bandwidth reader. Capture policy bytes before and after with exec-out cat and compare hashes on host; do not install tools or change policy.
      - Run a new disposable loopback-only guest with distinct four-byte field values. Require three negative controls before memory access and one positive four-read sixteen-byte observation.
      - Independently audit raw samples, process/file/maps, fixed address geometry, byte budget, policy bytes and system-server health. Seal result and commit/push before selecting continuation.
      - No physical contact is permitted by this task.
    acceptance: [The exact reader is validated or a precise independent failure is retained.]
    verification: [scope, control, audit, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.bench.cached-bandwidth-policy-decision
    title: Decide whether the bandwidth reader is ready for specimen observation
    state: open
    intent: Gate a separate physical baseline on completed offline proof.
    requires: [TASK.bench.cached-bandwidth-policy-bytes]
    requirements:
      - Distinguish synthetic mapping success from physical permission or bandwidth values.
      - If proof passes, admit a separate capture-backed sixteen-byte observation using existing credentials and explicit temporary helper staging under current three-hour authority. Stop on discrepancy; no target calls or writes.
      - Do not admit physical entitlement installation, capability changes, reboot or calibration. Commit and push the decision.
    acceptance: [A bounded continuation follows the evidence.]
    verification: [finding, limits, continuation]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
