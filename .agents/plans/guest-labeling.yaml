contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.guest.labeling-probe
    title: Test exact-stock guest labeling through the next startup boundary
    state: open
    intent: Determine whether a scoped platform seinfo assignment permits stock Sparrow process initialization.
    requires: [TASK.guest.admission-probe]
    requirements:
      - Preserve stock APK, firmware evidence, original guest image, and prior experiments.
      - Modify only the admitted exact-stock package in disposable guest state; retain original signature checks elsewhere.
      - Keep host policy and physical devices untouched; no global policy disabling or hardware behavioral model.
      - Keep stable instrumentation teardown and snapshot executable helpers before each run.
    acceptance:
      - Inspect the actual framework field and assignment ordering and document the guest-domain assumption.
      - Bind labeling to the exact APK digest, package, signer, and system shared UID; exercise negative controls.
      - Repeat clean-state attempts and capture process label, lifecycle or next failure, native logs and screenshots.
      - Distinguish harness faults from application outcomes and preserve all input hashes.
      - A reproduced negative outcome closes this question without iterative substitutions to force success.
    verification: [scoped-labeling, controls, repeated-outcome]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.guest.labeling-decision
    title: Evaluate labeling evidence and select the next bounded transition
    state: open
    intent: Decide whether to stop at a terminal condition or admit one evidence-backed environment investigation.
    requires: [TASK.guest.labeling-probe]
    requirements:
      - Stop at a stable useful UI or a genuine hardware dependency requiring behavioral modeling.
      - Do not infer application progress from installation, a starting window, or a PID alone.
      - Reconcile material architecture changes; preserve experiment failures and uncertainty.
    acceptance:
      - Classify the observed boundary with durable evidence and state what has and has not executed.
      - Record a terminal report or draft a small successor batch for one clear continuation within standing authorization.
      - Do not publish externally or alter official artifacts, host security, or physical instruments.
    verification: [boundary-evaluation, continuation-decision]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
