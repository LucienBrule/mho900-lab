contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.guest.breakpoint-rearm-contract
    title: Recover the guest breakpoint clear and rearm contract
    state: open
    intent: Explain the observed clear readback using pinned reference code and select a bounded delivery test.
    requires: [TASK.guest.remaining-init-control]
    requirements:
      - Preserve the negative group-remaining-init-01 capture and executable without adapting that experiment.
      - Inspect and pin upstream ARM64 debug regset encoding breakpoint creation validation and attribute update ordering; distinguish reference explanation from actual guest behavior.
      - Define exact initial clear armed clear and rearm readback hypotheses including metadata type length privilege and unused slots.
      - Require actual checkpoint delivery atomic progress and old-site revisit to evaluate rotation; do not equate a cached enable bit with installed hardware state.
      - Keep the recovered ADC SPU SCU transport and LA contract fixed and introduce no new modeled response or device path.
    acceptance: [A reviewable bounded profile and its limits are committed and pushed before new guest execution.]
    verification: [reference, hypothesis, scope]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.guest.remaining-init-rearm-control
    title: Test the complete remaining region under the recovered rearm profile
    state: open
    intent: Validate the observer lifecycle before any further stock initialization run.
    requires: [TASK.guest.breakpoint-rearm-contract]
    requirements:
      - Implement only the selected clear and rearm profile and evidence verification corrections; retain the four-store ten-checkpoint hardware contract.
      - Run one fresh disposable private suite with controls40..58 and prior0..39 regressions plus malformed-input rejection using a pinned executable.
      - Independently verify complete rotation SET and GET evidence full-register invariance atomic completion old-site revisit successful-open sentinels live-state guards thread coverage and exact cleanup.
      - Preserve any unexpected result as a terminal negative; no adaptive reprogramming or in-run hypothesis change.
      - Keep enforcement system_server stock inputs and host state preserved; stock application remains absent.
    acceptance: [Commit and push the reproducible positive or negative conclusion before another experiment.]
    verification: [controls, rejection, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.guest.remaining-init-rearm-decision
    title: Decide whether observer evidence supports the waiting stock run
    state: open
    intent: Release stock continuation only after the complete observer control succeeds or branch deliberately.
    requires: [TASK.guest.remaining-init-rearm-control]
    requirements:
      - Evaluate observed rotation and atomic progress separately from static reference explanations.
      - Permit the waiting stock task only with the exact fully validated executable; a negative result requires another explicit bounded decision and keeps stock execution gated.
      - Continue static-first region prediction and selective dynamic falsification without new FPGA semantics in this observer batch.
    acceptance: [Record the executable and stock gate decision or admit a bounded successor; commit and push before execution.]
    verification: [evaluation, continuation]
    required_extensions: []
    extensions: {}
