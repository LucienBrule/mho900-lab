contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.rf.usb-first-contact
    title: Observe source startup and identify its USB serial interface
    state: open
    intent: Establish a usable source control transport while RF and MCLK remain isolated from the instrument.
    requires: [TASK.rf.source-research]
    requirements:
      - Follow docs/research/rf-source-usb-first-contact.md. The operator requested a choice between USB first power and further disassembly and prefers USB control. Instruct only the isolated source connection described in that procedure.
      - Preserve a private timestamped host USB registry and serial-node baseline before connection. After operator confirmation, compare the same views to identify the new interface by device identity and topology rather than a guessed serial path.
      - Record the operator's first screen, visible settings and startup/output indication without equating UI state with measured RF. Keep the LCD ribbon intact, both SMA ports unconnected, and the physical scope untouched.
      - This task performs host registry inspection only. Do not open serial ports, send command bytes, install drivers, operate programming or calibration facilities, modify firmware or connect an RF path.
      - Retain raw before/after evidence privately and seal it. A missing device or unstable boot is a valid negative result; stop for a bounded decision instead of improvising further intervention.
    acceptance:
      - Source startup and USB/serial availability are evidenced, or a specific first-contact failure is preserved.
    verification: [host_baseline, startup, usb_identity, evidence_seal]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.rf.usb-control-decision
    title: Decide the smallest source serial-control compatibility experiment
    state: open
    intent: Convert the observed source identity and UI into one bounded control test or a precise transport remedy.
    requires: [TASK.rf.usb-first-contact]
    requirements:
      - Evaluate startup and transport evidence against the photographed CH340N bridge and candidate HawkRAO protocol. USB enumeration is not command compatibility or RF qualification.
      - If the source is stable and its serial target is identified, propose a host-verified point-command experiment with explicit reference frequency, lowest candidate power code, framing and checksum, and retained transmit/receive evidence. Account for port-open control-line effects and possible saved-setting changes.
      - Use initial UI/settings observations to select the candidate; do not copy the external 10 MHz reference example onto a nominal 25 MHz source. Keep both SMA ports isolated and distinguish UI confirmation from measured RF output.
      - If transport or startup failed, identify one bounded diagnostic instead of sending alternative protocols blindly. Admit and commit any executable successor before execution using the existing operator scope; seek clarification only for a genuinely new physical or persistent intervention.
      - Update the RF preparation handoff with the result without closing the instrument integration or measurement gates.
    acceptance:
      - A justified serial-control experiment or transport remedy is concrete and ready for bounded admission.
    verification: [evaluation, proposed_control, scope]
    required_extensions: []
    extensions: {}
epics:
  - kind: epic
    protocol: tasking/planning-draft-1
    id: EPIC.rf-source-control
    title: Source startup and USB control preparation
    scope: Isolated first power and transport identification followed by a bounded control decision; no scope interaction or RF connection.
    tasks: [TASK.rf.usb-first-contact, TASK.rf.usb-control-decision]
    required_extensions: []
    extensions: {}
