contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.specimen.fram-wrapper-controls
    title: Build identity-bound FRAM acquisition wrapper and disposable controls
    state: open
    intent: Preserve two exact-completion device reads with explicit adapter identity and failure artifacts.
    requires: [TASK.specimen.fram-read-contract-decision]
    requirements:
      - Implement a bounded ARM64 wrapper using the reviewed combined selector/read core, with no stored-data writes or forced slave selection; preserve return values and partial buffers.
      - Require explicit character-device path and identity, fixed address0x50 and8192-byte geometry; preserve two images separately and stop on failure or disagreement.
      - Prove actual wrapper control flow, syscalls, identity checks and failure artifacts with host/disposable controls before physical execution; record concurrency limits.
    acceptance: [The reviewed wrapper is ready for a separately recorded physical acquisition.]
    verification: [implementation, controls, limits]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.specimen.fram-physical-acquisition
    title: Acquire the live descriptor-bound FRAM baseline
    state: open
    intent: Close the stored private-state preservation gap before option installation.
    requires: [TASK.specimen.fram-wrapper-controls]
    requirements:
      - Under fresh verified capture and host isolation, resolve the live CFram descriptor to its actual adapter and device identity; recheck stock process and module ancestry.
      - Execute at most one admitted two-image read acquisition; preserve exact raw results and compare the private region with prior caches. Stop on transfer failure, identity mismatch or disagreement.
      - Seal evidence and restore host state; do not install options or modify capabilities during acquisition.
    acceptance: [Stored FRAM evidence or a precise failure is sealed without a stored-data write.]
    verification: [identity, readback, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.specimen.physical-install-readiness
    title: Prepare exact ordinary-option and capability deployment contracts
    state: open
    intent: Translate accepted guest results into minimal physical commands and rollback requirements.
    requires: [TASK.specimen.fram-read-contract-decision]
    requirements:
      - Inspect existing guest and physical evidence; identify ordinary installer entry point, exact candidate provenance, baseline and reboot verification commands without running them on the instrument.
      - Determine the smallest persistent D-capability deployment path, Android package/signature and native loading constraints, preserved originals and rollback checks; do not assume the guest component host proves APK deployment.
      - Keep private identities and license material outside source; distinguish documented interfaces from implementation-derived procedures.
    acceptance: [The next physical changes and their rollback/verification gates are concrete.]
    verification: [ordinary, capability, boundaries]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.specimen.preservation-install-decision
    title: Evaluate preserved baseline and admit physical installation successors
    state: open
    intent: Continue autonomously into ordinary options and then separate D capability only where evidence supports the exact procedure.
    requires: [TASK.specimen.fram-physical-acquisition, TASK.specimen.physical-install-readiness]
    requirements:
      - Evaluate stored-image completeness, rollback evidence and installation readiness; admit bounded installation and reboot-verification tasks when supported.
      - Preserve failures and branch deliberately without repeating experiments to obtain a desired result. Latest operator authorization includes physical installs and required reboots through capability verification, but excludes unplanned calibration or RF claims.
    acceptance: [A concrete continuation or evidence-backed blocker is recorded.]
    verification: [decision, continuation]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
