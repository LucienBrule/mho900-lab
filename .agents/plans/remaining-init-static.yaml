contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.hardware.remaining-init-grammar
    title: Recover the remaining initialization grammar including transport branches
    state: open
    intent: Predict SCU UART GD32 LA and version consumers as one typed contract before extending runtime observation.
    requires: [TASK.hardware.spu-region-decision]
    requirements:
      - Pin the unchanged stock library and byte ranges supporting SCU and LA operands, mutable shadows, call bindings, branch order and status propagation.
      - Recover board-power UART open frame write close and fatal-write paths, GD32 cached descriptor and reopen selectors, hardware-version device reads and delegated setup semantics.
      - Classify nodes as static-determined runtime-selected hardware-returned asynchronous or unknown; preserve branches instead of asserting an unconditional flat transcript.
      - Derive a typed TOML graph and deterministic candidate operations with Kotlin tooling; check provenance and graph integrity independently of the producer.
      - Trace the first mapped version reads through their immediate consumers and identify where further recovery or returned state is required; do not invent FPGA or UART responses.
      - Compare syscall observation and native checkpoints for the transport region, including synchronization perturbation, thread coverage, deadlines and negative controls required before stock continuation.
    acceptance: [A reproducible static conclusion with explicit unknowns and runtime falsification boundaries is committed and pushed before observer implementation.]
    verification: [provenance, grammar, branches, observation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.hardware.remaining-init-architecture
    title: Admit selective runtime falsification of the recovered initialization region
    state: open
    intent: Choose a bounded observation batch from recovered branches and data dependencies.
    requires: [TASK.hardware.remaining-init-grammar]
    requirements:
      - Evaluate SCU transport LA and version consumers together rather than launching one experiment per deterministic write.
      - Distinguish guest filesystem outcomes and static software behavior from hardware-returned state and modeled peripheral effects.
      - Specify exact observation phases live inputs guards private controls and terminal conditions; stop on divergence without adapting the experiment.
      - Preserve the two existing identity responses and stock bytes; any new returned value requires an explicit modeled hypothesis and recovered consumer.
    acceptance: [Plan inspect admit and commit plus push a bounded successor before its execution or document a concrete blocker.]
    verification: [evaluation, continuation]
    required_extensions: []
    extensions: {}
