contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.guest.thread-discovery
    title: Validate bounded thread-set discovery with a deliberately late worker
    state: open
    intent: Close the gap between known private TIDs and live process enumeration.
    requires: [TASK.guest.thread-control-decision]
    requirements:
      - Implement bounded repeated task-directory enumeration, thread-group and tracer checks, seizure, interrupts and wait-event accounting.
      - Keep all discovered threads stopped only during coverage establishment; track clone and exit events without assuming wait order.
      - Compare a stable private thread set with a worker created after the first enumeration but before attachment completes.
      - Require converged inventory with every live TID traced and stopped before declaring coverage; record all passes and identities.
      - Bound TIDs, passes, events and wall time; terminate and reap the private group without a device response.
    acceptance:
      - Independent verification proves the late worker was absent from the first inventory and included in the converged traced set.
      - Preserve any precise negative outcome and do not proceed to stock if controls fail.
      - Guest remains enforcing and system_server stable, with no stock application run in private controls.
    verification: [discovery, controls, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.hardware.thread-coverage
    title: Establish stock thread coverage while the modeled device remains unavailable
    state: open
    intent: Prove a live Sparrow thread-set coverage gate before integrating further execution observation.
    requires: [TASK.guest.thread-discovery]
    requirements:
      - Use a fresh pinned guest and byte-identical stock APK/native library with the existing narrow admission fixture.
      - Validate process snapshot and absent device path before the bounded discovery observer starts.
      - Require all live stock TIDs traced and stopped in a converged inventory, or record the exact failure.
      - Do not create the device path, map a synthetic device or supply a register response; terminate and reap after the coverage snapshot.
      - Preserve enforcement, stable system_server and teardown evidence.
    acceptance:
      - Independent verification binds stock PID, all observed thread identities, observer ELF and complete cleanup.
      - State that coverage at a stopped boundary does not prove future signal handling, access ordering or initialization progress.
      - Commit and push the private control conclusion before the stock run.
    verification: [stock-binding, coverage, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.hardware.thread-coverage-decision
    title: Evaluate discovery coverage before integrating the stock mapped-access observer
    state: open
    intent: Admit only the next bounded execution-observation question justified by coverage evidence.
    requires: [TASK.hardware.thread-coverage]
    requirements:
      - Reconcile private late-thread controls with the actual stock coverage result.
      - Retain the two established synthetic responses and no additional modeled values in any proposed integration batch.
    acceptance:
      - Select a bounded correction or repeat of the stock post-store witness under the wider observer.
      - Commit and push conclusions before the next experiment.
    verification: [evaluation, continuation]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
