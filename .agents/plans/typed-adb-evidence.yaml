contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.tooling.adb-frames
    title: Decode retained Android debug-bridge frames under an explicit checksum profile
    state: open
    intent: Separate raw transport framing from claims about instrument actions.
    requires: [TASK.tooling.archive-decision]
    requirements:
      - Pin the Android reference protocol and implementation provenance and document their checksum terminology difference before implementing a pure offline frame decoder.
      - Model the six supported cleartext commands as typed alternatives with exact private wire bytes and bounded header payload frame-count and total extents; reject unsupported or incomplete framing explicitly.
      - Require the additive payload checksum under the first profile; do not silently accept omitted checksums or infer compatibility with other protocol versions.
      - Preserve accepted prefixes and structural rejection information without creating connections launching adb or contacting any device.
    acceptance: [Independent synthetic framing controls establish the documented checksum-required decoder boundary.]
    verification: [provenance, contract, controls]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.tooling.adb-ready
    title: Match retained OPEN and stream-ready observations without claiming device action
    state: open
    intent: Reuse the distinction between a matching protocol reply and completed instrument behavior.
    requires: [TASK.tooling.archive-decision]
    requirements:
      - Select exactly one client OPEN by expected payload digest and match its local identifier to server ready replies under explicit ambiguity and identifier rules.
      - Return named ready missing or rejected outcomes and preserve the difference between matched protocol evidence TCP delivery total event order and completed device action.
      - Expose only offline delegated CLI inspection with payload and identity redaction, and compare a preserved reboot-delivery transcript as a positive or reproducible profile-negative result.
      - Exercise public installed library and CLI consumers without changing any old verifier or physical artifact.
    acceptance: [Synthetic ambiguity controls and preserved evidence comparison establish the narrow matching claim.]
    verification: [contract, controls, private_comparison, packaging]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.tooling.adb-decision
    title: Reconcile the explicit ADB evidence profile before further tooling
    state: open
    intent: Select any necessary protocol follow-up from evidence instead of weakening checks for progress.
    requires: [TASK.tooling.adb-frames, TASK.tooling.adb-ready]
    requirements:
      - Independently review framing and reply matching, verify strict checks installed distributions and remote CI, and commit and push conclusions.
      - If retained traffic does not fit the checksum-required profile, record the exact discrepancy and admit any other profile separately after reference reconciliation.
      - Recheck the autonomous deadline and identify a useful bounded offline successor or final checkpoint.
    acceptance: [The implemented evidence claim is supported and any unsupported profile remains explicit.]
    verification: [decision]
    required_extensions: []
    extensions: {}
epics:
  - kind: epic
    protocol: tasking/planning-draft-1
    id: EPIC.typed-adb-evidence
    title: Offline Android debug-bridge framing and stream-ready evidence
    scope: Retained cleartext protocol bytes only with no endpoint or device operations.
    tasks: [TASK.tooling.adb-frames, TASK.tooling.adb-ready, TASK.tooling.adb-decision]
    required_extensions: []
    extensions: {}
