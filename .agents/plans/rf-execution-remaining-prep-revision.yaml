protocol: "tasking/core-draft-2"
id: "TASK.rf.execution-decision"
title: "Freeze the RF comparison protocol and decide execution readiness"
state: "open"
intent: "Bind the experiment to actual equipment, claim scope and authorized physical transitions before data collection."
requires: ["TASK.rf.integration", "TASK.rf.stock-rollback-decision", "TASK.rf.policy-comparison-preparation", "TASK.rf.remaining-transition-preparation"]
requirements: ["Review source and pilot evidence against the selected question. Freeze hypotheses, frequency points, repeats, reference/normalization, estimator, sensitivity, uncertainty and stop criteria before comparison data.", "Pin software arms with actual hash/policy observations, matched acquisition conditions, calibration/option preservation, transition/reboot and rollback steps, source/drift checks and raw-evidence destinations.", "Use stock/derived/stock by default, documenting any justified change. Account for the last recorded derived starting state and explicitly choose the final software/bench state; no silent reapplication after rollback.", "Bind applicable operator authorization to the exact physical procedure. Check capture/export/cleanup readiness. Neither software FULL selection nor source setpoint proves the required policy or delivered amplitude.", "Close only on a supported go decision. On hold/no-go retain this task open, record the missing condition and admit a bounded remedy through normal planning and prerequisite revision; do not release acquisition on a failed gate.", "Commit and push the frozen protocol and decision before acquisition. A material change after this gate requires reconciliation and a new or revised experiment identity.", "Require independently reviewed remaining-arm preparation with the proved eight-byte timestamp comparator and complete evidence output layouts. Typed arm-ready inputs must bind actual accepted predecessor evidence; preparation never manufactures future policy, epoch, UI or thermal witnesses. The numerical comparison and physical authorization remain unchanged."]
acceptance: ["A frozen evidence-backed protocol, resolved readiness conditions and applicable authorization support one bounded physical comparison."]
required_extensions: []
extensions: {}
verification: ["frozen_protocol", "readiness", "authorization", "go_decision"]
