contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.guest.afe-calibration-static
    title: Recover the complete post-ADC AFE calibration loader contract
    state: open
    intent: Derive both AFE loaders and reachable save-helper behavior before choosing another guest experiment.
    requires: [TASK.guest.adc-sequence-stock-decision]
    requirements:
      - Preserve the successful stock ADC evidence, original APK, native library and firmware byte-for-byte. Perform read-only static analysis and host-side derived artifacts only; no guest execution in this task.
      - Pin library ranges and recover dispatcher continuation from333bac through the two AFE loaders at333bcc and333bd8, stopping the scope before clock loading at333bf4. Resolve LoadAfeZeroCalData, LoadAfeBandWidthCalData, DrvCalibrationAfe_BandWidthSaveData and every reachable hardware-facing or filesystem operation on this path.
      - Recover primary/fallback file paths, record sizes, object offsets, return/error propagation, default initialization, loops and conditional save behavior. Inspect provided stock assets read-only with hashes; distinguish corpus absence from guest absence and from physical instrument state.
      - Produce a typed TOML operation graph separating STATIC-DETERMINED, RUNTIME-SELECTED, HARDWARE-RETURNED, ASYNCHRONOUS and UNKNOWN operations. Correlate current frozen guest filesystem with statically possible branches, explicitly retaining uncertain selectors and return values.
      - Independently check instruction/range identities and derived constants, using targeted host controls where a new semantic checker is introduced. Identify the smallest complete prediction and observation checkpoints without adding device responses or assuming success from the ADC result.
      - Commit and push the recovered contract and unresolved questions before the evaluation task.
    acceptance: [The whole AFE loader pair and its reachable side effects have a reproducible bounded static contract, or an exact unresolved boundary is documented.]
    verification: [provenance, grammar, environment, checks, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.guest.afe-calibration-decision
    title: Select one bounded validation of the recovered AFE calibration contract
    state: open
    intent: Use static evidence to choose useful runtime falsification points instead of one experiment per software operation.
    requires: [TASK.guest.afe-calibration-static]
    requirements:
      - Evaluate the complete AFE loader pair against the actual333bac stock checkpoint and distinguish file reconstruction from mapped-register modeling. State the next externally unsatisfied dependency and all model assumptions.
      - Prefer one whole-subsystem prediction with precise entry/exit observations when supported. Do not split deterministic software writes or file-error paths into per-operation guest experiments. Retain mapped-access observation unless evidence establishes a concrete deficiency.
      - Draft a small successor preparation, qualified control and stock validation batch with an explicit decision task as needed; run plan, inspect mutation, admit against the expected revision and commit and push before execution. No new guest run or device response in this decision task.
    acceptance: [An evidence-supported bounded successor or precise limitation is committed and pushed.]
    verification: [evaluation, boundary, continuation]
    required_extensions: []
    extensions: {}
