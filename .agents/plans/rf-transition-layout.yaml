contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.rf.transition-layout-preparation
    title: Prepare the required SCPI evidence directories before stock execution
    state: open
    intent: Correct local output layout without changing physical or numerical semantics.
    requires: [TASK.rf.stock-rollback-recovery]
    requirements:
      - Preserve both stopped attempts and independently review the missing-directory failure. No observer, native removal or reboot occurred; do not claim stock from a complete transport connection.
      - Inspect all transition output preconditions and prepare a distinct run using the unchanged frozen controller and actual lease/configuration. Create the three required empty SCPI evidence directories before execution; reject missing, occupied or symlink output paths in offline preflight.
      - Test the real query-helper directory gate with a fail-on-use socket control, verify unchanged inputs and all physical gates, independently review readiness, and commit/push the correction before execution.
    acceptance: [Local evidence layout supports one unchanged gated baseline attempt or an explicit hold.]
    verification: [negative, layout, controls, independent_review, frozen_inputs]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.rf.stock-baseline-layout
    title: Execute one stock baseline with complete evidence layout
    state: open
    intent: Establish the stock arm without relaxing the failed attempt or its physical gates.
    requires: [TASK.rf.transition-layout-preparation]
    requirements:
      - Use a distinct immutable run and fresh full capture with the captured86400second lease and deadline2026-10-03T01:38:03Z. Attempt the baseline connection once; stop on failure rather than repeat unchanged operations.
      - Revalidate original APK, exact introduced standalone native file, derived process mapping, root identity, options, protected logical corpus and root-reviewed visible UI before removal. Observe only the existing four fixed reads16bytes per phase.
      - Remove only that verified introduced file and send exactly one normal reboot, with no ambiguous retry. Establish APK-backed stock17/17, new boot epoch and normal UI; retain greater1800seconds serviced warmup and existing preservation allowances.
      - Preserve any partial negative result without claiming stock. Require independent capture and state review, ordinary safe cleanup and a committed/pushed conclusion before another transition.
    acceptance: [A verified stock baseline or bounded negative outcome resolves the sole fresh attempt.]
    verification: [baseline, transition, stock_witness, preservation, capture, final_state]
    required_extensions: []
    extensions: {}
