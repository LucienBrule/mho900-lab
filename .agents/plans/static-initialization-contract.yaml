contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.hardware.auklet-init-contract
    title: Recover the stock userspace initialization contract statically
    state: open
    intent: Replace per-access discovery with whole-subsystem operation grammar and explicit ambiguity boundaries.
    requires: [TASK.hardware.two-write-decision]
    requirements:
      - Pin the unchanged stock native library and recover the observed startup hardware-call chain and surrounding subsystem routines.
      - Inventory direct callers of register reads/writes and hardware-facing open, mmap, ioctl and DMA functions; retain unresolved indirect edges explicitly.
      - Recover complete ADC initialization routines, tables, loops, modes, masks, delays, error propagation and later writable-state operations rather than just the observed prefix.
      - Identify neighboring initialization dependencies and reads whose values control branches, polling, returned state or upstream consumers.
      - Express a typed TOML operation graph with provenance, conditions, order/loop structure and classifications STATIC-DETERMINED, RUNTIME-SELECTED, HARDWARE-RETURNED, ASYNCHRONOUS or UNKNOWN.
      - Use Kotlin for reusable authored analysis tooling; preserve raw external disassembly and do not change stock artifacts or run a guest.
    acceptance:
      - Independently check instruction/table/call-site evidence and reconcile the graph with existing dynamic witnesses without treating unobserved predictions as runtime facts.
      - Publish explicit coverage and unresolved-edge limits; do not claim an entire library or hardware contract recovered merely because known routines are decoded.
    verification: [provenance, graph, semantics, coverage]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.hardware.kernel-abi-contract
    title: Correlate stock kernel modules and public XDMA reference with userspace ABI
    state: open
    intent: Recover the software device contract while keeping FPGA behavior explicitly unresolved.
    requires: [TASK.hardware.two-write-decision]
    requirements:
      - Locate and hash relevant exact stock kernel modules and report absent or unproven module associations.
      - Recover device naming, file operations, mmap extent/protection/lifetime, ioctl layouts and error paths where the binaries or pinned reference support them.
      - Correlate DMA, C2H/H2C, buffer/alignment and asynchronous interfaces with the stock userspace inventory.
      - Separate exact-module evidence from public reverse-engineered source behavior and any unresolved correspondence.
      - Do not infer FPGA reset values, register effects, timing, completion, interrupts or sample data from software plumbing.
      - Read-only analysis only; no module loading, guest run, physical access or artifact modification.
    acceptance:
      - Typed ABI evidence and uncertainty records identify which plumbing is recoverable and which boundaries still require runtime selection or behavioral evidence.
      - No equivalence claim between Orange-Rigol and actual MHO984 behavior without corroboration.
    verification: [provenance, abi, correlation, limits]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.hardware.static-contract-decision
    title: Select dynamic falsification experiments from the recovered contract graph
    state: open
    intent: Spend guest experiments on unresolved selectors and behavior rather than deterministic software operations.
    requires: [TASK.hardware.auklet-init-contract, TASK.hardware.kernel-abi-contract]
    requirements:
      - Combine userspace and kernel evidence into a bounded initialization contract graph and ranked ambiguity list.
      - Classify deterministic writes as static predictions; distinguish runtime-selected paths, hardware-returned reads, asynchronous behavior and unknowns.
      - Select whole deterministic regions for prefix/checkpoint validation and define immediate divergence stops.
      - Reevaluate the deferred 440-store transcript batch before allowing implementation or execution; revise or replace it when the graph supports a better boundary.
      - Preserve stock code, evidence provenance and synthetic-state labeling; do not claim FPGA behavior from kernel evidence.
    acceptance:
      - A small next batch targets named ambiguity boundaries with stated predictions and falsification criteria, rather than one task per known write.
      - Commit and push the static recovery and decision before the next guest experiment.
    verification: [synthesis, ambiguity-ranking, successor]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
