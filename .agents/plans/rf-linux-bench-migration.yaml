contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.rf.linux-bench-preparation
    title: Prepare a dedicated Linux bench controller while the specimen is disconnected
    state: open
    intent: Replace shared-workstation network dependencies with an ordinary isolated Linux device network.
    requires: [TASK.rf.host-isolation-decision]
    requirements:
      - The operator selected the dedicated Rocky Linux host, supplied SSH access and reported scope Ethernet unplugged. Preserve the stopped Mac branch and its evidence; do not resume its controller or automation. This task prepares only the new host and does not contact or mutate the specimen.
      - Preserve a timestamped host baseline and restoration information before configuration. Positively identify the wired physical interface and Wi-Fi management route. Preserve existing profiles, services, root-namespace firewall, SELinux enforcement, management connectivity and unrelated storage. Install only necessary free standard tooling with recorded provenance and versions.
      - Place the dedicated Ethernet interface in one named bench network namespace with loopback, a private host address, no default route, no Wi-Fi or virtual link to the management namespace, forwarding disabled and no NAT or external DNS. Prevent NetworkManager from configuring that interface during ownership. Provide explicit ownership, inspection and teardown using standard ip, systemd, dnsmasq and tcpdump facilities; no custom TCP implementation or blanket security disablement.
      - Prepare exactly one scope-MAC-bound private DHCP lease with a 24-hour duration, no router or DNS option, and DNS serving disabled. Do not start specimen DHCP, management or acquisition until a fresh capture and explicit operator cable transition are recorded under successor tasking.
      - Demonstrate ordinary Python socket operation and graceful full-packet recorder termination with drop statistics using only host-local controls away from the specimen. Stage a pinned Linux ADB executable and a locked Python workspace. Preserve source, baseline, setup outcome and host-control evidence separately from physical evidence.
    acceptance: [The disconnected Linux bench is configured and its host-only controls pass, or a concrete host prerequisite is recorded without specimen contact.]
    required_extensions: []
    extensions: {}
    verification: [host_baseline, isolated_namespace, standard_tools, host_controls, preserved_state]
  - protocol: tasking/core-draft-2
    id: TASK.rf.linux-bench-readiness
    title: Review Linux bench readiness and define the cable migration checkpoint
    state: open
    intent: Admit physical link introduction only after a small independently verified host setup.
    requires: [TASK.rf.linux-bench-preparation]
    requirements:
      - Independently inspect preserved baseline, actual namespace routes and interfaces, forwarding, DHCP configuration, recorder statistics and standard-tool provenance. Verify management connectivity is retained and no specimen contact occurred. Do not require unrelated global firewall state to be empty or disabled.
      - Keep conclusions about host-local controls distinct from scope reachability and RF qualification. Record the exact next physical cable transition and the minimum capture-first lease, identity and transport checks. Retain the current RF coax path and all stock, option and calibration invariants.
      - Decide whether to admit the bounded physical migration. Tasking must be planned, inspected, admitted against the expected revision and committed/pushed before execution. No new scope reboot, firmware, entitlement, calibration or RF measurement is included in host readiness.
    acceptance: [A reviewed host readiness result and concrete physical migration proposal are preserved.]
    required_extensions: []
    extensions: {}
    verification: [independent_review, claim_scope, next_checkpoint]
