contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.guest.init-tail-control
    title: Privately validate one coherent synthetic initialization tail
    state: open
    intent: Extend the tested mapped observer to a fixed ten-read two-write three-checkpoint region before calibration.
    requires: [TASK.hardware.init-tail-decision]
    requirements:
      - Implement the fixed experiments/init-tail/candidate.toml contract and docs/research/init-tail-observation-decision.md with exact stock bindings live selectors ordered accesses and state captures.
      - Preserve existing observer events and controls; separate tail counters; no single-step or code substitution; verify read destination plus PC changes and write PC-only changes.
      - Run one fresh disposable private suite covering complete region atomic progression wrong tuple width thread operand live state binding config parent outputs extra access ready mismatch stale-site revisit and deadline cleanup plus prior regressions.
      - Independently verify raw access ledger checkpoint rotations register invariants state propagation thread coverage and exact cleanup; preserve a negative without adapting that experiment.
      - Preserve stock inputs host state enforcement and system_server; stock application stays absent; only a complete private pass authorizes the dependent stock run with the identical executable.
    acceptance: [Commit and push positive or negative conclusion before any next experiment; a negative requires a new decision and keeps stock gated.]
    verification: [implementation, controls, rejection, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.hardware.stock-init-tail
    title: Falsify the complete synthetic version and DDR consumer region in stock Sparrow
    state: open
    intent: Test software state propagation to the calibration boundary under the fixed synthetic fixture.
    requires: [TASK.guest.init-tail-control]
    requirements:
      - Require complete private controls and the same executable; preserve APK and library byte-for-byte in one fresh disposable guest.
      - Validate the 464-store prefix then exactly ten new read responses two predicted stores and three checkpoints; do not adapt on mismatch.
      - Independently verify versions tap output order masks self-test result live configuration shadow state and unexecuted terminal PC before calibration.
      - Keep thread coverage and cleanup evidence explicit; no process-wide atomic snapshot or physical DDR clock or acquisition claim; preserve system_server enforcement and stop guest services.
    acceptance: [Commit and push the reproducible conclusion before successor execution.]
    verification: [inputs, sequence, state, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.hardware.init-tail-model-decision
    title: Evaluate the synthetic tail and select the next static subsystem boundary
    state: open
    intent: Use divergence or verified stock state to choose the next bounded minimum-instrument-personality investigation.
    requires: [TASK.hardware.stock-init-tail]
    requirements:
      - Evaluate actual captured state against the frozen static prediction without promoting synthetic ready state to hardware validation.
      - If calibration boundary is reached recover calibration loaders algorithms and thread startup before admitting more runtime effects; otherwise resolve the observed ambiguity deliberately.
      - Plan and inspect an explicit bounded successor within authorization or record the concrete blocker; retain static-first recovery and selective dynamic falsification.
    acceptance: [Commit and push the decision and admitted successor before execution.]
    verification: [evaluation, continuation]
    required_extensions: []
    extensions: {}
