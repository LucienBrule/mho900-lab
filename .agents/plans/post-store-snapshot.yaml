contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.hardware.post-store-snapshot
    title: Diagnose the stock snapshot gate and attempt unchanged post-store observation
    state: open
    intent: Separate process snapshot transport status from validated inputs before stock observation.
    requires: [TASK.hardware.post-store-inventory-decision]
    requirements:
      - Preserve the earlier status-255 capture and compare the original composite snapshot with separate command-line, label and maps reads.
      - Record individual status and error output; require complete validated stock inputs before attaching the supervisor.
      - Retain passing private inventory, width/direction and paired-read controls.
      - Retain exactly the two witnessed synthetic read responses and terminal PC 0x42a8f0; do not expand modeled behavior.
      - Preserve stock artifacts, enforcement, system_server stability and disposable guest teardown.
    acceptance:
      - Classify the composite and individual snapshot outcomes without treating populated output as command success.
      - Verify stock post-store state if reached, otherwise preserve the exact next failed gate.
      - Record thread inventories and explicit main-thread-only observation limits.
    verification: [snapshot, controls, stock-state, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.hardware.post-store-snapshot-decision
    title: Evaluate snapshot and post-store evidence before selecting the next dependency
    state: open
    intent: Advance only from witnessed observer and stock behavior.
    requires: [TASK.hardware.post-store-snapshot]
    requirements:
      - Distinguish actual stock state from private controls and synthetic inputs.
      - Evaluate thread coverage before expanding device responses.
    acceptance:
      - Select a bounded continuation from the actual result and commit and push before the next run.
    verification: [evaluation, continuation]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
