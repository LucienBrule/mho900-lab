contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.bench.first-contact-host-preparation
    title: Preserve host baseline and prepare isolated passive Ethernet capture
    state: open
    intent: Establish every host prerequisite before requesting the first specimen connection.
    requires: []
    requirements:
      - Preserve private local evidence with stable run identity, UTC and local timestamps, host network and relevant device baseline, and exact restoration information before configuration changes.
      - Positively identify the scope-facing dock Ethernet interface from host device topology. Prove separate default routing, disabled forwarding, no sharing, bridging or NAT path, no DHCP server, and disabled host DHCP behavior on that segment.
      - Configure only the identified scope-facing interface as necessary, retaining restoration data. Do not change host security policy. If privilege or evidence is unavailable, stop before any physical handoff.
      - Run a complete Layer Two packet capture without a restrictive filter, retaining raw packets and a human-readable observation stream. Verify writer health, interface MAC and durable baseline.
      - Honor operator-reported disconnected power and USB-B and empty front host port. Only after all eleven prerequisites pass, issue the prescribed Ethernet-only handoff and wait for operator confirmation.
    acceptance: [A preserved host baseline and verified passive capture support the Ethernet-only handoff.]
    verification: [baseline, identity, isolation, capture, handoff]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.bench.first-contact-passive-boot
    title: Observe separately confirmed Ethernet and first power transitions passively
    state: open
    intent: Preserve first controlled boot evidence without supplying network services or changing specimen configuration.
    requires: [TASK.bench.first-contact-host-preparation]
    requirements:
      - Wait for explicit Ethernet-only confirmation, record the transition and check carrier and capture health before the prescribed power-only handoff. Do not infer physical transitions from elapsed time.
      - Wait for explicit power confirmation and then timestamp carrier and specimen-originated traffic. Preserve full raw capture and classify observed protocols without answering traffic or actively querying services.
      - Request operator photographs or transcription for visible boot and UI information; do not infer firmware, options, stable UI or prompts from network silence.
      - Stop for unexpected behavior or any requirement to change persistent state. No DHCP service, management address, discovery, scans, SCPI, ADB, Web Control, USB connection or storage insertion is admitted.
      - Preserve a reasonable passive interval and immutable phase artifacts with hashes; keep observation, inference and operator reports distinct.
    acceptance: [Confirmed physical transitions and passive first-boot observations are preserved or an explicit stop condition is documented.]
    verification: [transitions, capture, observations, limits]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.bench.first-contact-decision
    title: Report Stage One evidence and proposed Stage Two boundary
    state: open
    intent: Return first-contact evidence for operator review without admitting Stage Two.
    requires: [TASK.bench.first-contact-passive-boot]
    requirements:
      - Report physical transitions, boot timing, observed network MAC and IP behavior, visible model firmware options, stable UI status, persistent-state prompts, artifact paths and hashes.
      - Preserve private specimen and host identifiers outside public source. Commit and push only appropriate generic procedure and redacted conclusions.
      - Recommend a bounded Stage Two based on observations; do not admit or execute Stage Two. Preserve exact host restoration information and state any remaining temporary host configuration.
    acceptance: [Stage One has a reproducible evidence report and an explicit operator decision boundary.]
    verification: [report, provenance, restoration, decision]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
