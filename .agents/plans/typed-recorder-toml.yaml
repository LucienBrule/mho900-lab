contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.tooling.recorder-toml
    title: Preserve supported recorder strings through TOML records
    state: open
    intent: Keep the recorder value contract consistent with the artifacts consumed by its child bootstrap.
    requires: [TASK.tooling.recorder-preflight]
    requirements:
      - Preserve the construction-only reproducer showing accepted DEL-bearing arguments and readiness cannot be parsed after existing TOML serialization.
      - Encode supported Unicode scalar strings into valid TOML without changing their value or broadening process arguments, keeping private invalid content out of diagnostics.
      - Exercise launch readiness terminal and reconciliation string records with parser round trips and a fixed synthetic child, including installed distributions.
    acceptance: [Every tested supported string retains its exact value through the emitted TOML and valid child ownership remains bounded.]
    verification: [reproducer, contract, controls, packaging]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.tooling.recorder-toml-decision
    title: Reconcile recorder string fidelity and close the typed toolkit checkpoint
    state: open
    intent: Finish the observed serialization correction with independent evidence and a clean handoff.
    requires: [TASK.tooling.recorder-toml]
    requirements:
      - Independently inspect string round trips and lifecycle behavior, verify strict installed and remote CI gates, and commit and push the result.
      - Record remaining scope limits and the next useful direction rather than adding an unmotivated acquisition abstraction.
    acceptance: [The serialization gap is closed and the typed workspace checkpoint is reproducible.]
    verification: [decision]
    required_extensions: []
    extensions: {}
epics:
  - kind: epic
    protocol: tasking/planning-draft-1
    id: EPIC.typed-recorder-toml
    title: Recorder string fidelity at the TOML boundary
    scope: Local synthetic strings and owned child controls only.
    tasks: [TASK.tooling.recorder-toml, TASK.tooling.recorder-toml-decision]
    required_extensions: []
    extensions: {}
