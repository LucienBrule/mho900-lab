contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.specimen.fram-native-metadata
    title: Replace incompatible shell stat with a tested native metadata probe
    state: open
    intent: Validate descriptor and device identity without device opening or I2C operations.
    requires: [TASK.specimen.preservation-install-decision]
    requirements:
      - Implement bounded ARM64 metadata-only stat following a requested path, reporting mode/device numbers/inode with no device open or ioctl.
      - Prove node and proc-descriptor following and failures in host controls and the pinned disposable guest; preserve earlier acquisition failure.
      - Adapt and validate fresh controller binding and independent verification to raw native metadata.
    acceptance: [Adapter identity no longer depends on unsupported shell stat options.]
    verification: [probe, controls, integration]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.specimen.fram-native-acquisition
    title: Acquire paired FRAM baseline with native identity metadata
    state: open
    intent: Obtain a complete stored private-state baseline through the verified read-only wrapper.
    requires: [TASK.specimen.fram-native-metadata]
    requirements:
      - Use a fresh isolated capture and fresh stock owner observation; reconcile descriptor/node/sysfs identities before and after one paired read.
      - Require exact two-message completion, two complete equal8192-byte images, raw transaction preservation and independent cache/payload comparison; stop on discrepancy.
      - Verify remote helper exit, complete capture/drop counters and host restoration; seal artifacts without option installation or capability modification.
    acceptance: [Complete stored baseline or precise negative conclusion is preserved.]
    verification: [binding, images, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.specimen.fram-install-decision
    title: Evaluate stored baseline and admit ordinary physical option sequence
    state: open
    intent: Advance the authorized physical completion program from preservation into installation.
    requires: [TASK.specimen.fram-native-acquisition, TASK.specimen.physical-install-readiness]
    requirements:
      - Decide whether exact baseline and rollback limitations permit the guest-validated ordinary install sequence; admit bounded successors with before/after/reboot evidence.
      - Keep D capability deployment separate and preserve failure evidence; no RF performance or calibration claims.
    acceptance: [The next authorized physical transition is supported by explicit evidence.]
    verification: [decision, continuation]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
