contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.hardware.post-store-inventory
    title: Validate ARM64 thread inventory and gate the unchanged stock post-store capture
    state: open
    intent: Resolve the private observer ABI failure before drawing stock device-to-state conclusions.
    requires: [TASK.hardware.post-store-decision]
    requirements:
      - Preserve the previous negative capture and test directory flags 0x10000 and 0x4000 in one explicit private comparison.
      - Record directory open and read return codes, bounded enumeration and status errors; reject incomplete inventories.
      - Require all private controls and inventories before stock observation.
      - Keep stock responses at offsets 0x4048 and 0x4044 with values 0xe1234567 and 0x89abcdef, and terminal PC 0x42a8f0 unchanged.
      - No further responses, stock artifact modifications, instruction stepping through synchronization or physical instrument access.
      - Capture enforcement and stable system_server evidence even when a private gate exits early; tear down the disposable guest.
    acceptance:
      - Independent verification classifies both directory flags and checks each successful inventory against its stopped private child.
      - Either stock post-store register/global evidence is independently verified or the exact next failed gate is preserved as a negative result.
      - Explicitly state main-thread supervision and non-atomic inventory limitations before any model expansion.
    verification: [directory-control, private-controls, stock-state, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.hardware.post-store-inventory-decision
    title: Evaluate stock post-store evidence and select a bounded coverage or initialization continuation
    state: open
    intent: Follow the next witnessed dependency after resolving observer correctness.
    requires: [TASK.hardware.post-store-inventory]
    requirements:
      - Separate observed stock state, synthetic inputs and untraced-thread uncertainty.
      - Require explicit thread coverage evaluation before admitting additional modeled responses.
    acceptance:
      - Select one bounded continuation justified by the actual capture, including a negative gate when appropriate.
      - Commit and push conclusions before another experiment.
    verification: [evaluation, continuation]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
