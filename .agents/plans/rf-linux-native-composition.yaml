contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.rf.linux-transition-lease-composition
    title: Compose offline Linux reboot lease and health boundaries
    state: open
    intent: Replace the identified transition supervisor gap without contacting the instrument.
    requires: [TASK.rf.linux-native-adapter-preparation]
    requirements:
      - Pin the accepted Linux native boundary and independently reviewed integration design, original RebootLeaseGate and captured packet models, current namespace/tool/clock evidence and exact transaction source. Preserve all original peer, 86400-second lease, no gateway/DNS and forwarding-zero guarantees.
      - Implement a typed offline live-pcap event adapter and explicit one-shot transition health phases for one 180-second normal reboot. Only its bounded pre-new-ACK phase may permit carrier loss or invalidated lease; all ownership, isolation, capture and authorization guards remain active. A sent ACK is never captured authority. Require fresh matching REQUEST/ACK after intent, RELEASE only before new ACK inside the original window and DECLINE always stop.
      - Supply focused host-only controls with preserved captured or clearly synthetic fixtures for frame identity/options/order, RELEASE-after-ACK, DECLINE, phase expiry, changed clock domain and process identity. No DHCP service, namespace/network mutation, capture, ADB, SCPI, serial, native mutation or specimen contact occurs in this task.
      - Independently review and freeze the reusable boundary with exact source hashes, raw fixture provenance, limits and future runtime integration checklist. Do not fabricate future leases or grant physical B/A2 readiness from supplied controls.
    acceptance: [The reviewed offline lease/health composition or its precise remaining integration blocker is preserved.]
    required_extensions: []
    extensions: {}
    verification: [inputs, phases, captured_authority, controls, independent_review]
  - protocol: tasking/core-draft-2
    id: TASK.rf.linux-native-supervisor-composition
    title: Compose the Linux native lifecycle delegate offline
    state: open
    intent: Preserve the exact reviewed native transaction under conventional Linux ownership.
    requires: [TASK.rf.linux-transition-lease-composition]
    requirements:
      - Bind the separately reviewed Linux lease/phase boundary and original exact native deploy/remove source and pure validators. Adapt the tested foreground Linux owner callback and explicit remote completion framing, retaining raw partial command output, durable intent, no uncertain retries and exact introduction/removal lineage.
      - Prepare the original before/after APK/native/full corpus/epoch/ownership/map checks, fixed 16-byte O_RDONLY policy observations and corrected bounded reader lifecycle/reap proof. Retain original corpus exceptions only across transition; preserve one normal reboot, UID-first at most one authorized conditional root request and one distinct post-root readiness sequence, 60-second serviced settle and actual PNG/UI acceptance, exact 1801-second serviced warm-up and final gates.
      - Use a separate explicit native duration schema covering all gates, warm-up and cleanup, with original 4800/2400-second reserves and concrete Linux-domain deadline/lease checks. No future A1/B arm, postboot ACK, UI, corpus or introduced file may be invented. Freeze supplied-executor controls and runnable or template entrypoints with all unresolved physical integration limits stated.
      - Work entirely offline on preserved source and host-only controls. Do not start SSH, ADB, SCPI, DHCP, capture or serial against the bench, change namespace/network state, stage a reader, mutate native selection, request root/reboot or operate the specimen. Independent review must distinguish executable code and supplied controls from physically validated behavior.
    acceptance: [A reviewed native lifecycle composition or its exact unresolved offline integration boundary is durable.]
    required_extensions: []
    extensions: {}
    verification: [transaction, lifecycle, preservation, time_ownership, independent_review]
  - protocol: tasking/core-draft-2
    id: TASK.rf.linux-native-composition-decision
    title: Evaluate Linux transition composition and current RF frontier
    state: open
    intent: Determine the next concrete boundary from actual stock records and reviewed host composition.
    requires: [TASK.rf.linux-native-supervisor-composition, TASK.rf.linux-stock-arm-decision]
    requirements:
      - Independently evaluate supplied composition controls and exact transaction/lease/clock/ownership/reader/UI/thermal bounds, distinguishing remaining implementation gaps from physical unknowns. Bind the actual original A1 decision and source/return-control evidence without creating missing B/A2 records or historical reducer acceptance.
      - Reassess remaining current authorization and original 4800/2400-second reservations. If complete reviewed controller, accepted current A1 and actual lease/ownership cannot all support the full reversible sequence, record the exact boundary and future invocation requirements rather than mutate or shorten controls.
      - This decision grants no physical native transition itself. Any later actual B/A2 requires separate inspected expected-revision admission and committed/pushed tasking plus current input gates. At the active deadline checkpoint known-safe ordinary/owned helper state and evidence with a clean pushed checkout; do not extend authorization.
    acceptance: [The composition and actual stock evidence yield an explicit next RF action or a precise remaining blocker.]
    required_extensions: []
    extensions: {}
    verification: [independent_review, actual_frontier, reservations, next_boundary]
