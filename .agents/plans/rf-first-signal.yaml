contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.rf.first-signal
    title: Observe one 100 MHz signal through the prepared CH1 path
    state: open
    intent: Establish whether the delivered source and direct 50-ohm path produce an interpretable first signal.
    requires: [TASK.rf.pilot-settings-decision]
    requirements:
      - Coordinate one operator power-on of the source through its established USB connection with RF OUT already connected to CH1, MCLK unconnected and no programmer attached. Record startup conditions; no persistence cycle or rewiring is part of this task.
      - Revalidate the delivered USB-UART endpoint and ownership. Use the established factory sender for exactly one 100 MHz raw-power-zero point command, retaining the request and transport outcome. Do not infer RF output or calibrated level from the host write or raw power code.
      - Use a fresh verified capture for isolated host addressing and SCPI; preserve the six-hour single-client lease restriction and no gateway, DNS, forwarding or NAT. Read back the prepared 50-ohm, 1x, full-bandwidth CH1 settings before measurement.
      - Use documented SCPI frequency and amplitude reads and, if straightforward, a bounded display-waveform export with scaling metadata. Observe actual frequency, clipping and signal stability. Preserve command transcripts, settings and measurement limits; a failed or ambiguous signal is a valid result.
      - Stop on unexpected hardware, overloaded or ambiguous input, recorder failure or communication failure. No sweep, alternative protocol, repeated source commands, firmware or entitlement change, calibration, reboot, ADB or additional instrument interface.
      - Seal evidence and commit and push the conclusion before another signal experiment. State the final source, scope and host state explicitly. The existing RF comparison gates remain separate.
    acceptance: [One bounded first-signal result or precise failure is retained without claiming a calibrated response or policy comparison.]
    verification: [authority, source, scope, signal, evidence, final_state]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.rf.first-signal-decision
    title: Evaluate the first signal and the next integration question
    state: open
    intent: Choose the next bounded RF preparation step from the actual signal evidence.
    requires: [TASK.rf.first-signal]
    requirements:
      - Distinguish source command acceptance, observed frequency and amplitude, export readiness and unresolved source accuracy. Do not equate a displayed waveform with 1 GHz characterization.
      - Reconcile the pilot result with the existing RF-response inventory and integration tasks; identify the exact next measurement or tooling gap rather than expanding the completed run.
      - Commit and push the evaluation. No physical operation occurs in this decision task.
    acceptance: [The first signal has a scoped disposition and an evidence-based next step.]
    verification: [evaluation, limits, next_step]
    required_extensions: []
    extensions: {}
