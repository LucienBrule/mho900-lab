contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.rf.epoch-transport-preparation
    title: Prepare explicit isolated ADB transport readiness before RF epoch reads
    state: open
    intent: Resolve the observed offline host transport without retrying device metadata reads.
    requires: [TASK.rf.impedance-decision]
    requirements:
      - Seal and independently review the prerequisite-only ADB offline stop, including absent SCPI/source/settings/RAW operations, recorder statistics and restored host state. Preserve the earlier impedance stop and reviewed remedy unchanged.
      - Prepare a separate minimal capture adapter which disconnects only the exact isolated peer from the owned local ADB server once, connects that peer once, and observes the local server device list within a bounded deadline before the existing single process-epoch read. Preserve raw connection/status output and stop on timeout, ambiguity or failed connection. Do not restart adbd, invoke root, retry shell reads or change the physical specimen.
      - Retain the independently accepted stock arm, exact mapping and process checks, current captured lease, host isolation, ordinary impedance normalization/restoration, fixed source schedule, all 75 slots and unchanged numeric/receiver rules. Preserve all predecessor tools and artifacts.
      - Verify transport readiness with deterministic host-only controls, review exact generated differences and fresh actual bindings independently, and prepare corresponding completed-arm verification without weakening any physical or numerical acceptance rule. No physical operation belongs to this preparation.
    acceptance: [The isolated transport remedy is independently prepared or a hold is recorded.]
    verification: [stop_evidence, adaptation, controls, concrete_review]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.rf.epoch-transport-decision
    title: Evaluate isolated transport readiness before fresh A1 acquisition
    state: open
    intent: Admit only a host transport correction supported by the preserved pre-read stop.
    requires: [TASK.rf.epoch-transport-preparation]
    requirements:
      - Record GO or HOLD against the actual sealed stop, prepared connection/status control and independent review. A GO retains exactly one metadata read, full original process/mapping checks and no specimen state change.
      - Commit and push this decision and the previous stop conclusion before root-owned physical execution. TASK.rf.acquire and the unchanged frozen contract remain authoritative, with hard deadline 2026-10-03T01:38:03Z and no ambiguous retries or outcome-driven waveform repetitions.
    acceptance: [A reasoned transport GO or HOLD resolves the sole readiness question.]
    verification: [decision, preservation, execution_boundary]
    required_extensions: []
    extensions: {}
