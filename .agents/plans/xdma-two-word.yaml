contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.hardware.two-word
    title: Observe stock two-word composition and stop before conversion
    state: open
    intent: Test the predicted mask and global store using two explicit synthetic mapped-register responses.
    requires: [TASK.hardware.identity-flow-decision]
    requirements:
      - Disposable guest only; preserve stock APK and native library bytes; no physical instrument access.
      - Complete at most two guarded read32 accesses at offsets 0x4048 then 0x4044.
      - Use distinct deterministic words with upper high-word bits set; do not assign physical identity semantics.
      - Stop the observed thread before the converter call, on any unsupported access, or at a fixed step budget.
      - Preserve failed attempts and close the stated question even if the expected observation is unavailable.
    acceptance:
      - Pin helper, input and output hashes and the explicit two-word fixture.
      - Validate two-read completion and bounded stepping against a private deterministic control before stock execution.
      - Preserve existing width and direction controls and add a control that rejects an unexpected second access.
      - Record real stopped PC, completed response count and global value if the boundary is reached.
      - Independently verify evidence, stock bytes, stable system_server and guest teardown.
    verification: [controls, stock-observation, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.hardware.two-word-decision
    title: Evaluate two-word observation and choose the next bounded question
    state: open
    intent: Separate demonstrated composition from unresolved downstream transformation and instrument semantics.
    requires: [TASK.hardware.two-word]
    requirements:
      - Do not treat synthetic data or static predictions as physical instrument evidence.
    acceptance:
      - State whether the stock observation supports the predicted composition and where execution stopped.
      - Evaluate stop coverage, unresolved helper behavior and any unexpected architecture evidence.
      - Commit and push conclusions before another experiment; leave any successor explicitly proposed or admitted.
    verification: [evaluation, next-question]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
