contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.specimen.fram-read-contract
    title: Validate bounded FRAM read transaction contract offline
    state: open
    intent: Prepare an exact-completion read primitive without contacting the device.
    requires: [TASK.specimen.physical-private-cache-decision]
    requirements:
      - Correlate pinned stock CFram page_read and fram_read semantics with available pinned Linux reference UAPI and transfer return conventions. Keep reference provenance separate from stock binary and physical evidence.
      - Implement only a deterministic offline transaction core for address0x50, two-byte big-endian offset selection,16-byte reads within8192bytes and exact two-message completion. No real device opening or ioctl implementation.
      - Verify ARM64 struct layout and host positive/short/negative/out-of-bounds controls; preserve artifacts. No physical contact, reads, installation or reboot.
      - Record live descriptor/node/adapter identity and capture prerequisites still needed by any future physical wrapper.
    acceptance: [The read primitive and remaining physical wrapper obligations are testable and explicit.]
    verification: [provenance, abi, controls, limits]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.specimen.fram-read-contract-decision
    title: Evaluate readiness for a stored FRAM acquisition wrapper
    state: open
    intent: Choose the smallest next implementation after offline read-contract controls.
    requires: [TASK.specimen.fram-read-contract]
    requirements:
      - Report whether the transaction core satisfies exact completion and range bounds, without claiming a complete acquisition tool or hardware validation.
      - Specify the next bounded wrapper/guest/physical gates and stop at the current timed checkpoint. Commit and push conclusions.
    acceptance: [The remaining acquisition work is concrete without premature hardware claims.]
    verification: [finding, continuation, boundaries]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
