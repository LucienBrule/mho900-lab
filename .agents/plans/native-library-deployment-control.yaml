contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.specimen.native-library-deployment-control
    title: Test normal APK native-library override precedence in a disposable guest
    state: open
    intent: Determine whether a persistent native sidecar can preserve the installed signed APK.
    requires: [TASK.specimen.physical-install-readiness]
    requirements:
      - Build a minimal signed ARM64 APK using extractNativeLibs=false and ordinary System.loadLibrary with distinguishable embedded and sidecar JNI markers; preserve exact inputs and loader metadata.
      - On the pinned isolated API25 guest, demonstrate baseline embedded loading, sidecar precedence or rejection, process restart, actual guest reboot and sidecar removal rollback without modifying APK bytes or guest security policy.
      - Record mapped file paths and results; distinguish Android guest behavior from physical package compatibility. A failed precedence test is a valid conclusion and must not be relabeled success.
    acceptance: [Normal package loading behavior and rollback are experimentally established for the guest.]
    verification: [fixture, observations, persistence, limits]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.specimen.native-library-deployment-decision
    title: Evaluate signed-APK-preserving capability deployment
    state: open
    intent: Select the smallest supported physical capability deployment path.
    requires: [TASK.specimen.native-library-deployment-control]
    requirements:
      - Compare guest loader evidence with physical package metadata; identify exact remaining baseline and rollback gates before sidecar deployment.
      - Preserve stock APK and native ancestors, and do not claim physical1GHz performance from native policy or guest loading.
    acceptance: [The deployment candidate is justified or rejected with concrete evidence.]
    verification: [decision, boundaries]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
