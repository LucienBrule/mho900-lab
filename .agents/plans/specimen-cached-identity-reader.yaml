contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.specimen.cached-identity-reader-control
    title: Validate a bounded external cached-identity reader in the guest
    state: open
    intent: Prepare an independently addressed read of existing stock DNA and fileKeys without target attachment or native calls during observation.
    requires: [TASK.specimen.option-catalog-decision]
    requirements:
      - Commit and push admitted tasking before implementation. Use unchanged pinned specimen-identical APK/native inputs and only synthetic identity material in the disposable ARM64 guest.
      - Build one narrowly scoped reader for cached DNA at ELF VA 0xbbccf0, length 8 and fileKeys at 0xbbcd1c, length 16. Use a single read-only proc memory descriptor with exact positioned reads; no automatic alternate backend, attachment, signal stop, target writes or target native-function calls.
      - Derive load bias from the actual ELF PT_LOAD geometry and current maps, including the writable segment's 0x1000 virtual/file difference. Require exact stock file hash and regular file identity, consistent executable/data mappings, ordinary readable private non-executable file-backed ranges and bounded arithmetic. Reject ambiguous, deleted, anonymous or device substitutes.
      - Bind reads to explicit process identity and boot/starttime evidence. Preserve metadata before and after, exactly two samples of 8 plus 16 bytes each, short/error reads and mismatches. Describe stable repeated samples as non-atomic evidence, never a snapshot guarantee.
      - Separate actual ART/factory/synthetic identity setup from observation. Detach the setup instrumentation before launching the external reader, leave the prepared process running normally, and compare the reader's independently resolved addresses and bytes with the earlier setup witness. Do not initialize License, exercise ADC/AFE or run an installer for this control.
      - Validate relevant host-only ELF/maps boundary cases and bounded negative controls for wrong pin, stale process identity and invalid range before the positive reader control. Stop and preserve any unexpected failure; do not change policy, credentials or backend to obtain a desired result.
      - Retain guest policy hashes and enforcement/health at setup and read boundaries. Existing guest instrumentation policy effects do not establish physical permission. Preserve loopback confinement, dedicated guest-only endpoints, frozen sources, binary hashes and durable evidence.
      - No physical scope contact, helper staging, process lookup, ADB connection, lease renewal or other specimen interaction. The resulting helper is a proposal input, not authorization to deploy it.
    acceptance: ['The exact bounded guest read is validated, or its first failure and remaining dependency are preserved.']
    verification: [addressing, controls, read_witness, identity, boundaries, provenance]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.specimen.cached-identity-reader-decision
    title: Reconcile reader evidence and the next physical parity question
    state: open
    intent: Decide whether the helper is suitable for a separately authorized observation and preserve explicit remaining limits.
    requires: [TASK.specimen.cached-identity-reader-control]
    requirements:
      - Evaluate addressing, repeated bytes, process lifetime and permission evidence separately. A guest pass cannot establish specimen permissions or initialized physical values.
      - State the smallest proposed future physical action, including any temporary helper staging, existing-credential requirement, maximum memory bytes and stop-on-denial rule. Do not execute it overnight.
      - If the control fails, close the actual question and admit a bounded successor only when justified. Otherwise release reporting; avoid repetitive synthetic permutations that cannot answer the physical parity question.
      - Commit and push the decision and any admitted successor before execution.
    acceptance: ['A bounded physical proposal or exact unresolved control dependency is recorded without specimen contact.']
    verification: [finding, physical_boundary, continuation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.specimen.overnight-research-report
    title: Publish the offline entitlement and capability research handoff
    state: open
    intent: Leave a clear morning report and reusable research writing with a clean pushed source tree.
    requires: [TASK.specimen.cached-identity-reader-decision]
    requirements:
      - Report stock provenance, ordinary option before/after/process/reboot state, exact guest mutations, persistence scope, separate D result, negatives, remaining blockers and the next smallest physical action requiring authorization.
      - Update repository navigation and stale current-status statements using links to preserved historical evidence. Keep source free of private host mappings, unit-specific identities and acquired key material.
      - Write useful research or blog drafts based on established findings. Distinguish acceptance, queried policy, modeled durability and physical operation; do not publish to an external service.
      - Refresh private local reflection only where useful under the operator's explicit SOUL authorization. Keep it untracked and outside authored source.
      - Verify taskctl state, relevant report links and source disclosure boundaries. Commit and push meaningful conclusions, leave the repository clean, and make any remaining physical authorization boundary explicit.
    acceptance: ['The morning handoff and research drafts are accurate, committed and pushed; private reflections remain local.']
    verification: [report, evidence_links, disclosure, repository_state]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
