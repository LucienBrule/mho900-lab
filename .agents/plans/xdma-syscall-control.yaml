contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.hardware.syscall-control
    title: Observe stock bypass mmap failure through a disposable kernel-path control
    state: open
    intent: Test whether a failed real mmap explains the prior low-address fault without application injection.
    requires: [TASK.hardware.mapping-decision]
    requirements:
      - Preserve stock APK and library bytes and executable instructions.
      - Limit device substitution to a disposable guest alias from the absent bypass path to dev-null.
      - Do not supply hardware register values or access physical instruments or change host security.
    acceptance:
      - Pin the available native syscall observer and validate it with a deterministic file-open control.
      - Observe stock open and mmap results and first fault, or preserve the exact observer availability or permission failure.
      - Record process maps, guest policy state, stock hashes, system_server stability and complete teardown.
      - Distinguish kernel syscall evidence from static interpretation and instrumentation limitations.
    verification: [observer-control, stock-observation, integrity]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.hardware.syscall-decision
    title: Evaluate the syscall control and select the second bounded experiment
    state: open
    intent: Close the tested question before changing the transport or observer.
    requires: [TASK.hardware.syscall-control]
    requirements:
      - Do not classify partial evidence as a validated hardware access.
    acceptance:
      - State the supported conclusion and unresolved fault or mapping questions.
      - Select a bounded successor from evidence or stop if further work is not justified.
    verification: [evaluation, next-question]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
