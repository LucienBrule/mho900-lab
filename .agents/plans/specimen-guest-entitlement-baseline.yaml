contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.specimen.entitlement-surface
    title: Recover the stock entitlement installer boundary
    state: open
    intent: Identify the smallest ordinary stock installer and query path that can be tested with specimen-derived guest state.
    requires: [TASK.bench.specimen-acquisition-decision]
    requirements:
      - Commit tasking before execution. Work offline from preserved specimen applications and logical files; verify exact hashes against official .26 before reusing prior analysis.
      - Statically recover the ordinary installer and option-query entry points, argument and result semantics, option identifiers, persistence paths, identity dependencies and call order. Distinguish observed stock behavior from prior community references and unknowns.
      - Identify the required initializers and smallest faithful invocation boundary. Do not substitute success for uninitialized services or assume installer persistence merely from a parser return value.
      - Preserve private keys, identifiers and proprietary bytes outside tracked source. Publish only a redacted interface/dependency record with reproducible provenance and explicit limits.
      - No physical instrument contact or mutation, no stock binary changes, and no model/capability redirect in this task. Separate ordinary entitlement handling from the later D-capability experiment.
    acceptance: [A bounded installer/query contract and guest-baseline requirements or precise unresolved dependency are recorded.]
    verification: [inputs, entrypoints, state, limits]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.specimen.guest-entitlement-baseline
    title: Establish a specimen-derived guest baseline for entitlement tests
    state: open
    intent: Determine whether stock specimen application bytes can expose coherent identity and option state in the existing disposable harness.
    requires: [TASK.specimen.entitlement-surface]
    requirements:
      - Use a disposable guest overlay and copied unit files with a frozen pre-run manifest. Keep acquired originals and stock APK/native bytes unchanged; pin guest image, fixture versions and copied-file provenance privately.
      - Reuse established harness evidence for byte-identical binaries. Execute one bounded baseline at the ordinary interface identified by static recovery; do not require full factory-image boot or rediscover deterministic ADC writes.
      - Record actual model identity, capability and option state wherever the stock interface reaches them. Mark synthetic hardware responses and unavailable values explicitly; do not promote partial initialization into a valid entitlement baseline.
      - Stop at the first externally unsatisfied dependency or stock error. Preserve file deltas and invocation results, then evaluate deliberately. Do not install options or apply the D redirect during the baseline task.
      - No physical instrument access. If a physical observation would materially resolve the blocker, record the exact bench question instead of inventing a response.
    acceptance: [A reproducible pre-install guest baseline or bounded failure with the next dependency is preserved.]
    verification: [inputs, invocation, state, deltas, boundary]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.specimen.entitlement-baseline-decision
    title: Evaluate readiness for the guest ordinary-entitlement trial
    state: open
    intent: Admit the next smallest justified installer experiment or environment correction from the recovered contract and baseline evidence.
    requires: [TASK.specimen.guest-entitlement-baseline]
    requirements:
      - Compare the baseline outcome with the statically recovered ordinary interface and explicit identity/persistence requirements. A negative baseline is valid progress; do not change its question retroactively.
      - If the baseline is coherent, draft a bounded disposable-guest installer and persistence trial followed by its evaluation. Otherwise admit only one evidence-supported environment correction or record the exact unresolved bench question.
      - Keep ordinary entitlements, the separate guest D-capability experiment, full board-image boot and physical mutations as distinct questions. Physical entitlement and 1 GHz transitions remain at their later authorization gates.
      - Run taskctl plan, inspect, admit against the expected revision, and commit and push any successor tasking before execution. Commit and push the decision evidence.
    acceptance: [The next guest step or precise blocker is decided from evidence.]
    verification: [baseline, continuation, boundaries]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
