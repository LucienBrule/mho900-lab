contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.specimen.physical-d-sidecar
    title: Deploy the pinned derived native sidecar and verify normal startup
    state: open
    intent: Select the D capability record while retaining the original signed application and public identity.
    requires: [TASK.specimen.physical-ordinary-decision]
    requirements:
      - Require accepted ordinary-option reboot persistence and current preserved baseline. Derive the actual package native library directory from current metadata and require the target sidecar absent.
      - Under fresh isolated capture install only the derived native ELF SHA256 09689a442e8d285775b37089a8d631e1e445fe03d3499e830cdcc8f32439504e using verified temporary-file transfer and atomic rename with system ownership and0644 mode; preserve the stock signed APK byte-for-byte.
      - Send only one normal reboot request; preserve a transport timeout without retransmission and continue the bounded observation for a fresh lease and changed boot.
      - Require new boot identity, normal full Sparrow UI, unchanged public identity, all ten ordinary statuses with BND false, exact license/key persistence, actual standalone native mapping/hash and repeated cached18/18 using the accepted16-byte observer.
      - On loading or startup failure preserve evidence and remove only the introduced sidecar before a normal recovery reboot; verify original APK-backed loading and restored17/17. No calibration, reset, firmware replacement or unrelated configuration change.
    acceptance: [The first physical D startup is accepted or the failed transition and bounded rollback are preserved.]
    verification: [deployment, startup, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.specimen.physical-d-persistence
    title: Verify physical D capability across a further normal reboot
    state: open
    intent: Establish repeatable native loading and retained option state independently of the deployment boot.
    requires: [TASK.specimen.physical-d-sidecar]
    requirements:
      - Proceed only after accepted first D startup. Under a separate fresh capture request one normal reboot without further native or entitlement changes; a client timeout is retained without retransmission while bounded observation resolves the actual boot.
      - Require a new boot ID and stable full UI, unchanged public identity and signed APK, exact derived standalone mapping/hash, ten ordinary statuses with BND false, stable license/key files and repeated raw/effective18/18.
      - Preserve timing, UI, raw SCPI, process/map and bounded-memory evidence, capture drop statistics and host restoration; retain the scoped software-capability claim.
    acceptance: [The physical software capability and ordinary options persist across the independent reboot.]
    verification: [reboot, persistence, boundaries]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.specimen.rf-evaluation-ready
    title: Prepare the RF evaluation gate from verified physical software state
    state: open
    intent: Complete Stage4 and make Stage5 reviewable without claiming or measuring analog performance.
    requires: [TASK.specimen.physical-d-persistence]
    requirements:
      - Reconcile physical baseline, ten-option persistence, original signed APK and actual derived18/18 startup evidence; keep stock and derived originals and rollback procedure available.
      - Prepare a source-grounded RF comparison plan with equipment and path characterization, single-channel conditions, stock/derived/rollback comparison, uncertainty and decision criteria. Record missing bench inputs explicitly.
      - Do not apply RF, connect probes or USB, run calibration or claim measured1GHz performance. Commit and push conclusions and leave the checkout clean for operator evaluation.
    acceptance: [Stage4 is complete and Stage5 is ready for operator evaluation.]
    verification: [reconciliation, evaluation_plan, handoff]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
