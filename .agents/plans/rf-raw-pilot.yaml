contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.rf.raw-pilot
    title: Qualify raw acquisition-memory export at 100 MHz
    state: open
    intent: Establish complete raw samples and restoration before a current-policy frequency survey.
    requires: [TASK.rf.source-accession, TASK.rf.display-waveform-decision]
    requirements:
      - Bind the three-hour operator authorization to this unchanged-source pilot. Preserve RF wiring, source firmware and specimen software, identity, options and calibration; send no source command.
      - Start a fresh complete packet capture before isolated host addressing; revalidate the lease, endpoint, route and no gateway, DNS, forwarding or NAT. Require graceful recorder exit and retained drop statistics.
      - Retain original channel, acquisition, timebase, trigger and waveform-export settings. Set CH1 to 50 mV/div; set 1 microsecond/div and 100k memory depth for a longer record while verifying 4 GSa/s. Use documented STOP and RAW ASCII export with matching preambles and bounded complete response retention.
      - Acquire one raw record at the established 100 MHz source setting. Validate count against selected extent and metadata, sample interval against actual rate, finite voltages and input range. Do not request optional rise/fall-time measurements or retry a failed export.
      - Restore waveform-export, vertical, memory and timebase settings and running acquisition where the transport remains healthy. Retain any restoration failure. Stop physical work on capture, transport, metadata or unexpected-state failure.
      - Reduce only sealed evidence using offline controls. Preserve raw records and controller provenance; commit and push the conclusion before the next experiment.
    acceptance: [One complete raw acquisition and its restoration are demonstrated, or the precise bounded failure is retained.]
    verification: [authority, isolation, raw_export, restoration, controls, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.rf.raw-pilot-decision
    title: Evaluate raw acquisition readiness and choose the survey boundary
    state: open
    intent: Admit a bounded frequency survey only when the raw acquisition and estimator evidence support it.
    requires: [TASK.rf.raw-pilot]
    requirements:
      - Evaluate raw sample semantics, voltage scaling, complete record extent, actual sample rate, restoration and recorder health. Distinguish raw acquisition from the prior display record.
      - Assess source-shape and aliasing limits, choose a frozen modest frequency grid and reference repeats, and retain negative outcomes without extending the same experiment.
      - If supported, draft, plan-inspect, admit and commit a separate current-policy survey before execution. Otherwise record the smallest bounded remedy or exact bench question; do not release the matched-policy comparison gate.
    acceptance: [A supported survey continuation or precise remaining acquisition question is recorded.]
    verification: [evaluation, estimator_limits, decision]
    required_extensions: []
    extensions: {}

roadmaps:
  - kind: roadmap
    protocol: tasking/planning-draft-1
    id: ROADMAP.rf-current-policy
    title: Raw acquisition and current-policy RF survey
    intent: Establish repeatable raw measurements and map the connected RF chain before a matched policy comparison.
    tasks: [TASK.rf.raw-pilot, TASK.rf.raw-pilot-decision]
    required_extensions: []
    extensions: {}
