contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.hardware.identity-flow
    title: Trace stock two-word composition and the first downstream value use
    state: open
    intent: Establish the consumer dataflow before choosing a coherent device identity fixture.
    requires: [TASK.hardware.single-read-decision]
    requirements:
      - Read-only analysis of the unchanged stock native library and existing guest evidence.
      - No new guest run, register response, physical instrument access or artifact modification.
      - Separate directly decoded operations, observed frames and unresolved indirect consumers.
    acceptance:
      - Pin disassembly and symbols for the two-word assembly and observed caller chain.
      - Identify the earliest established downstream store, transformation or value-dependent decision with exact offsets.
      - Explicitly bound unresolved calls and avoid assigning physical identity semantics from names alone.
      - Review the evidence with a bounded independent agent when available and resolve material findings.
    verification: [composition, consumer-flow, review]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.hardware.identity-flow-decision
    title: Evaluate identity dataflow and define the next bounded observation
    state: open
    intent: Determine what further observation is justified without inventing a physical device identity.
    requires: [TASK.hardware.identity-flow]
    requirements:
      - Do not turn static leads or synthetic values into claims about the actual instrument.
    acceptance:
      - State the supported dataflow conclusion and the remaining question.
      - Close this read-only batch, commit and push; do not silently add another live experiment.
    verification: [evaluation, next-question]
    required_extensions: []
    extensions: {}
roadmaps: []
epics: []
