contract: taskctl.seed/alpha1
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.tooling.public-walkthrough
    title: Publish a synthetic sealed-review walkthrough with known inputs
    state: open
    intent: Let contributors reproduce the composed offline result without private instrument evidence.
    requires: [TASK.tooling.adb-decision]
    requirements:
      - Provide a tiny independently identified synthetic capture transcript statistics and profile with a preserved manifest pin and project-relative provenance.
      - Document the existing public CLI sequence from a fresh copy with outputs outside the sealed tree and no network device or recorder activity.
      - Demonstrate accepted composition and distinguish post-seal mutation from separately resealed transcript disagreement using retained failure reports.
      - Exercise the exact public example through source and installed distributions and include relevant documentation and fixture paths in CI triggers.
    acceptance: [A contributor can reproduce the expected positive and negative results using only tracked inputs and the locked workspace.]
    verification: [provenance, walkthrough, controls, packaging]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.tooling.public-walkthrough-decision
    title: Evaluate public reproducibility and select the next useful tooling boundary
    state: open
    intent: Prefer demonstrated reuse and clear limits over adding speculative abstractions.
    requires: [TASK.tooling.public-walkthrough]
    requirements:
      - Independently review the synthetic provenance and copy-paste procedure, verify remote CI and preserve the existing independent adversarial fixtures.
      - Recheck the authorized deadline and choose a bounded offline successor from a concrete gap or record a final checkpoint.
    acceptance: [The public example is reproducible and any next work has a documented reason.]
    verification: [decision]
    required_extensions: []
    extensions: {}
epics:
  - kind: epic
    protocol: tasking/planning-draft-1
    id: EPIC.typed-public-walkthrough
    title: Public reproducibility of composed evidence tooling
    scope: Synthetic offline example and existing APIs only; no physical device operations.
    tasks: [TASK.tooling.public-walkthrough, TASK.tooling.public-walkthrough-decision]
    required_extensions: []
    extensions: {}
