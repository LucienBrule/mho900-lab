contract: taskctl.seed/alpha1
roadmaps:
  - kind: roadmap
    protocol: tasking/planning-draft-2
    id: ROADMAP.rf-limiter-control
    title: Ordinary channel-limiter sensitivity at fixed source frequency
    intent: Evaluate a reversible acquisition-setting control without changing installed software policy.
    tasks: [TASK.rf.limiter-control, TASK.rf.limiter-control-decision]
    disposition: active
    acceptance:
      - The fixed975MHz OFF-to250M-toOFF fifteen-record acquisition or exact bounded failure is sealed with transport, condition-specific validity and restoration evidence.
      - The frozen AC RMS and OFF return criteria yield a reproducible setting-associated conclusion with alias, source-stability and software-policy limits.
    required_extensions: []
    extensions: {}
tasks:
  - protocol: tasking/core-draft-2
    id: TASK.rf.limiter-control
    title: Acquire a fixed975MHz ordinary channel-limiter control
    state: open
    intent: Observe sampled measurement sensitivity to the documented ordinary CH1 limit selection.
    requires: [TASK.rf.raw-qualified-survey-decision]
    requirements:
      - Implement and independently review a new controller following docs/research/rf-limiter-control-protocol.md after admission and commit/push. Freeze its controls before physical use; preserve previous sealed runs.
      - Under fresh verified isolated capture acquire five fresh100kRAW4GSa/s records each at OFF-A,250M,OFF-B with one975MHz raw-zero source command and no intergroup source change. Preserve exact SCPI/source bytes and USB ownership checks; no firmware/policy/entitlement/calibration/wiring transition.
      - Preserve unchanged default receive receipts. Require OFF qualification and independent hard RAW geometry/rate/finite/upper-range validity for every record; allow only explicitly frozen250M low-floor or receive-stage outcomes. Stop all unexpected failures without retries or replacement records.
      - Make the planned100MHz source return only after all15 complete, restore ordinary scope/export/RUN settings while healthy, preserve graceful recorder/drop and host-restoration evidence, seal and independently verify acquisition, commit/push before final reduction.
    acceptance: [The fifteen-slot control or precise bounded negative/failure is preserved with condition-specific qualification and restoration evidence.]
    verification: [controller_controls, preconditions, source, raw_records, condition_guards, transport, restoration, preservation]
    required_extensions: []
    extensions: {}
  - protocol: tasking/core-draft-2
    id: TASK.rf.limiter-control-decision
    title: Evaluate reversible sampled AC output sensitivity
    state: open
    intent: Apply frozen whole-record AC RMS criteria and identify the next unresolved physical comparison.
    requires: [TASK.rf.limiter-control]
    requirements:
      - Independently reduce only sealed original records using unwindowed demeaned population AC RMS. Retain every slot, DC/extrema/Vpp/default receive outcome, group means/population SD and uncorrected OFF anchors.
      - Apply the frozen all-pairs6dB and mean-return0.3dB criteria; preserve zero/low-signal as labeled outcomes without invented finite attenuation or noise fitting. Report positive, negative or inconclusive evidence without changing criteria.
      - Keep the conclusion at setting-associated sampled complete-chain sensitivity; preserve source transient/load/digital/alias uncertainty and the separate calibrated-bandwidth and matched-software-policy gates. Record the exact next bench question without executing a policy transition in this window.
      - Commit/push the conclusion and leave clean preserved state before the three-hour deadline.
    acceptance: [A reproducible sensitivity conclusion or exact inconclusive boundary follows from the sealed control and unchanged frozen criteria.]
    verification: [controls, reduction, anchors, limits, next_question]
    required_extensions: []
    extensions: {}
