protocol: "tasking/core-draft-2"
id: "TASK.rf.host-isolation-decision"
title: "Decide whether the changed host baseline supports a fresh diagnostic"
state: "open"
intent: "Reconcile host-state drift before admitting another bounded physical observation."
requires:
  - "TASK.rf.host-isolation-reassessment"
requirements:
  - "Review exact current host evidence and independent findings against the closed diagnostic and original isolation guarantees. GO needs disabled forwarding and no scope-facing sharing, bridge, NAT or external-routing path; an enabled filter must never be disabled to obtain progress."
  - "If current host is NO-GO only because forwarding is enabled, but specific complete translation and DHCP configuration independently establish exclusion of the scope interface and subnet, admit one bounded preparation-acquisition-decision batch for a temporary snapshot/forwarding-zero/restoration network fixture with the unchanged one-record waveform question. Preserve enabled packet filtering, exact policy and DHCP configuration, unrelated services and processes; never disable or flush security controls. The fixture is ordinary authorized host network preparation and restoration, with global VM-forwarded traffic temporarily suspended and disclosed. Require independently reviewed implementation, continuous isolation checks, no repeated forced writes, and exact prior forwarding restoration only after owned transport retirement, alias absence and helper cleanup. If current host already GO, admit the unchanged fresh diagnostic. Plan, inspect, expected-revision admission and commit/push before execution; completed182200 root remains immutable."
  - "If uncertain or failed, record the exact external prerequisite and stop physical contact. Missing RF samples still provide no verification or disproof. Do not admit a matched comparison until actual coherent RAW evidence supports its common range."
  - "Preserve stock originals and protected material, unchanged cables and controls, no new reset/root restart/native transition for the diagnostic, and the hard deadline2026-10-03T01:38:03Z. Owned cleanup and final state must remain explicit."
acceptance:
  - "An evidence-bound GO with a separately admitted successor or an explicit external limitation is preserved."
required_extensions: []
extensions: {}
verification:
  - "finding"
  - "gate_reconciliation"
  - "continuation"
