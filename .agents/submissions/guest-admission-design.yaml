evidence:
  framework-evidence: >-
    Fresh inspect-03 boot identified the pinned guest fingerprint and services.odex SHA-256
    8f6019912e6a22f220a222fdde2d553f688e81b5a09587caab1623c9e25d0bc9. Guest oatdump records relevant
    original DEX control flow in out/guest-admission/inspect-03/verify-signatures-oatdump.txt, SHA-256
    f6f89e825c284412747ef08fefae654dd74d156597bfed5e9519253a3bebcb29. Frida runtime reflection independently
    resolves the method and fields in frida-inspection.txt, SHA-256 bc802d39290ec41a06cf9c47b9705ce8d19a03ad99a687b050a1c8e5c686203f.
    Relevant method flow agrees with the cited AOSP reference, without claiming complete build equivalence.
  scoped-design: >-
    docs/research/guest-admission.md specifies original-method-first exception handling limited to error -8,
    exact stock bytes, package, signer, requested and assigned UID, unchanged platform signer and new single-APK
    installation. tools/guest/admission-exception.js implements this boundary. Root debugging and attachment
    were observed. Frida's guest SELinux changes are measured and explicitly documented as a fidelity limit.
    Rollback discards the disposable guest. Host policy, source image and stock APK remain unchanged.
  negative-control-plan: >-
    The report specifies unrelated-package, different-signer and same-signer changed-byte controls with required
    rejection and guard events before stock installation. Kotlin generates the changed-byte fixture by adding an
    ignored signing-block entry; ordinary apksigner verification is required before use. The probe must validate
    this design dynamically, repeat from clean state and stop at the next observed startup failure.
