{"protocol":"tasking/core-draft-2","id":"TASK.rf.reduce","title":"Reduce sealed RF records and quantify comparison limits","state":"open","intent":"Turn retained measurements into reproducible relative and, where supported, absolute response estimates.","requires":["TASK.rf.acquire"],"requirements":["Work offline from sealed records using the frozen estimator and normalization. Exercise known-amplitude synthetic records and malformed/incomplete controls before interpreting physical results.","Check scaling/preambles, actual sampling, completeness and decimation; retain fit residuals, repeat dispersion and baseline-return drift. Missing arms remain missing rather than being inferred from expected behavior.","Separate relative policy effects from corrected absolute response; quantify supported uncertainty and unresolved source/spectral/loading effects. An uncharacterized chain cannot establish calibrated absolute bandwidth.","Produce reproducible tables/plots with explicit scope and data exclusions, keeping unit identifiers and raw private evidence out of source. Reuse the typed workspace conventions for any necessary Python implementation."],"acceptance":["Reproducible reduction supports scoped response estimates or an explicit finding that the retained data cannot answer the declared question."],"required_extensions":[],"extensions":{},"verification":["estimator_controls","reduction","uncertainty","limitations"]}
