{"protocol":"tasking/core-draft-2","id":"TASK.rf.current-survey-decision","title":"Evaluate sampled RF-chain response and comparison readiness","state":"open","intent":"Identify what the survey establishes and the smallest remaining uncertainty before policy comparison.","requires":["TASK.rf.current-survey"],"requirements":["Use sealed records and frozen estimator controls to report all visits, repeats, failures and alias flags. Show apparent amplitudes, fitted/readback frequency, residuals, range checks, repeat dispersion and both unnormalized reference anchors.","Treat fit bounds and 0.3dB drift threshold as declared engineering choices, not calibrated uncertainties. Do not drift-correct from two anchors, infer missing arms, or turn uncharacterized source-chain response into absolute scope bandwidth.","Compare identifiable sampled components with harmonic sensitivity diagnostics and flag possible fundamental collisions. A low residual alone does not qualify isolated gain or a policy effect.","Keep matched-policy execution and absolute bandwidth gates open unless their actual requirements are satisfied. Record the exact smallest bench question, and admit only useful bounded successors inside the remaining time/authority.","Commit and push conclusions with a clean checkpoint and final state report by the three-hour deadline."],"acceptance":["A scoped survey finding and justified next measurement question follow from all retained data and controls."],"required_extensions":[],"extensions":{},"verification":["controls","reduction","drift","claim_limits","next_question"]}
