{"protocol":"tasking/core-draft-2","id":"TASK.specimen.factory-diagnostic","title":"Identify the stock native factory prerequisite","state":"open","intent":"Locate the baseline factory null access and recover the smallest missing caller or runtime contract.","requires":["TASK.specimen.entitlement-baseline-decision"],"requirements":["Commit and push tasking before execution. Preserve baseline-02 as a negative result; use fresh guest state and unchanged specimen libraries.","Recover the factory caller and callback setup statically first. Capture a precise native fault PC, registers or bounded call trace in one diagnostic run if static evidence cannot settle the prerequisite.","Do not substitute successful service or entitlement answers. A real callback registration or initialization may be proposed from its caller contract, but do not silently fold that correction into the diagnostic run.","Preserve source snapshots, native observations, filesystem deltas and guest health. Keep child loopback isolation and disabled ADB discovery. No physical access, option install or capability redirect.","Close on the concrete prerequisite or remaining bounded uncertainty; do not require full application or ADC initialization without evidence of a dependency."],"acceptance":["The factory failure is attributed to a concrete caller/runtime prerequisite or a precise remaining diagnostic boundary."],"required_extensions":[],"extensions":{},"verification":["inputs","fault","interpretation","limits"]}
