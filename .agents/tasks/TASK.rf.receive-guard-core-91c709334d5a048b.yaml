{"protocol":"tasking/core-draft-2","id":"TASK.rf.receive-guard-core","title":"Add a typed offline sampled-frequency receive guard","state":"open","intent":"Qualify coherent sampled receive frequency without relying on the discrepant built-in measurement.","requires":["TASK.rf.frequency-diagnostic-decision"],"requirements":["Add a modular mho-rf uv workspace library, strictly typed immutable named requests and accepted/rejected results. Consume supplied RawQualified waveform evidence, rebind it to retained bytes and observations, and never open an instrument or file.","Freeze the guard as demeaned periodic Hann rFFT, strongest nonDC bin within 0.5 to1.5 times command, require both the selected band bin and global strongest nonDC bin within1%command and at least20%of one-sided nonDC spectral power within peak plus/minus2bins. Handle DC/Nyquist weights, invalid/degenerate bands, finite data and profile bounds explicitly; no calibrated amplitude or physical frequency-origin claim.","Keep frequency bin, bin spacing, energy fraction, command, supplied profile and waveform hash distinct. Add an offline Click endpoint/delegate for supplied files and explicit acquisition observations; emit TOML without private paths or sample dumps.","Add meaningful exact/offbin/incorrect-carrier/weak-band/noise/alias/display/malformed controls. Demonstrate that an out-of-Nyquist tone can alias into an accepted sampled component, preserving the physical-frequency limit.","Run workspace quality and installed-wheel checks plus an independent invocation on the sealed600MHz discriminator. Commit/push the reusable component before physical use."],"acceptance":["The typed offline guard rejects declared negative controls and qualifies a preserved raw sampled component with correct evidence limits."],"required_extensions":[],"extensions":{},"verification":["types","controls","quality","installed_consumer","discriminator_witness","preservation"]}
