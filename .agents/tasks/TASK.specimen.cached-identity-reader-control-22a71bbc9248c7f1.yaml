{"protocol":"tasking/core-draft-2","id":"TASK.specimen.cached-identity-reader-control","title":"Validate a bounded external cached-identity reader in the guest","state":"closed","intent":"Prepare an independently addressed read of existing stock DNA and fileKeys without target attachment or native calls during observation.","requires":["TASK.specimen.option-catalog-decision"],"requirements":["Commit and push admitted tasking before implementation. Use unchanged pinned specimen-identical APK/native inputs and only synthetic identity material in the disposable ARM64 guest.","Build one narrowly scoped reader for cached DNA at ELF VA 0xbbccf0, length 8 and fileKeys at 0xbbcd1c, length 16. Use a single read-only proc memory descriptor with exact positioned reads; no automatic alternate backend, attachment, signal stop, target writes or target native-function calls.","Derive load bias from the actual ELF PT_LOAD geometry and current maps, including the writable segment's 0x1000 virtual/file difference. Require exact stock file hash and regular file identity, consistent executable/data mappings, ordinary readable private non-executable file-backed ranges and bounded arithmetic. Reject ambiguous, deleted, anonymous or device substitutes.","Bind reads to explicit process identity and boot/starttime evidence. Preserve metadata before and after, exactly two samples of 8 plus 16 bytes each, short/error reads and mismatches. Describe stable repeated samples as non-atomic evidence, never a snapshot guarantee.","Separate actual ART/factory/synthetic identity setup from observation. Detach the setup instrumentation before launching the external reader, leave the prepared process running normally, and compare the reader's independently resolved addresses and bytes with the earlier setup witness. Do not initialize License, exercise ADC/AFE or run an installer for this control.","Validate relevant host-only ELF/maps boundary cases and bounded negative controls for wrong pin, stale process identity and invalid range before the positive reader control. Stop and preserve any unexpected failure; do not change policy, credentials or backend to obtain a desired result.","Retain guest policy hashes and enforcement/health at setup and read boundaries. Existing guest instrumentation policy effects do not establish physical permission. Preserve loopback confinement, dedicated guest-only endpoints, frozen sources, binary hashes and durable evidence.","No physical scope contact, helper staging, process lookup, ADB connection, lease renewal or other specimen interaction. The resulting helper is a proposal input, not authorization to deploy it."],"acceptance":["The exact bounded guest read is validated, or its first failure and remaining dependency are preserved."],"required_extensions":[],"extensions":{},"verification":["addressing","controls","read_witness","identity","boundaries","provenance"]}
