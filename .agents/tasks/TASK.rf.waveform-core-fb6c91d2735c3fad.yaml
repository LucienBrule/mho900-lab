{"protocol":"tasking/core-draft-2","id":"TASK.rf.waveform-core","title":"Add an offline typed raw ASCII waveform boundary","state":"open","intent":"Make raw-record qualification reusable without contacting instruments or changing the identity codec.","requires":["TASK.rf.raw-pilot-decision"],"requirements":["Add a small uv workspace library with strict immutable named Pydantic or dataclass models and accepted/rejected outcomes for supplied ASCII waveform and preamble bytes. Keep it independent of Click and hardware transport.","Validate bounded exact LF or CRLF framing, ten preamble fields, format and mode, count, finite numeric values, sentinel rejection and selected raw extent. Preserve hashes and external bytes; ASCII samples already represent volts and must not be rescaled.","Qualify raw sample interval against explicit actual-rate and memory/extent observations. Model record duration and first-to-last span separately. Add an offline Click endpoint/delegate only for supplied-file qualification, with TOML output.","Use typed Python workspace conventions and meaningful malformed, scaling, count and interval controls. Run required quality gates and an independent invocation on the preserved raw pilot. No physical access in tests or tooling.","Document the parser and acquisition-vs-display limit; commit and push the component before using it for survey qualification."],"acceptance":["Reusable typed supplied-byte qualification passes adversarial controls and recognizes the sealed raw pilot without claiming calibrated RF gain."],"required_extensions":[],"extensions":{},"verification":["types","protocol_controls","quality","pilot_witness","preservation"]}
