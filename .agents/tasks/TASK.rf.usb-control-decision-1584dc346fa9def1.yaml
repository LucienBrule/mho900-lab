{"protocol":"tasking/core-draft-2","id":"TASK.rf.usb-control-decision","title":"Decide the smallest source serial-control compatibility experiment","state":"closed","intent":"Convert the observed source identity and UI into one bounded control test or a precise transport remedy.","requires":["TASK.rf.usb-first-contact"],"requirements":["Evaluate startup and transport evidence against the photographed CH340N bridge and candidate HawkRAO protocol. USB enumeration is not command compatibility or RF qualification.","If the source is stable and its serial target is identified, propose a host-verified point-command experiment with explicit reference frequency, lowest candidate power code, framing and checksum, and retained transmit/receive evidence. Account for port-open control-line effects and possible saved-setting changes.","Use initial UI/settings observations to select the candidate; do not copy the external 10 MHz reference example onto a nominal 25 MHz source. Keep both SMA ports isolated and distinguish UI confirmation from measured RF output.","If transport or startup failed, identify one bounded diagnostic instead of sending alternative protocols blindly. Admit and commit any executable successor before execution using the existing operator scope; seek clarification only for a genuinely new physical or persistent intervention.","Update the RF preparation handoff with the result without closing the instrument integration or measurement gates."],"acceptance":["A justified serial-control experiment or transport remedy is concrete and ready for bounded admission."],"required_extensions":[],"extensions":{},"verification":["evaluation","proposed_control","scope"]}
