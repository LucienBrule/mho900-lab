{"protocol":"tasking/core-draft-2","id":"TASK.tooling.recorder-lifecycle","title":"Own bounded recorder process startup and graceful shutdown","state":"open","intent":"Compose process lifecycle without repeating the inherited signal-mask failure.","requires":["TASK.tooling.transport-decision"],"requirements":["Add typed requests states and results for an explicitly owned child process; normalize signal mask and dispositions only in the child before exec without preexec_fn or global host changes.","Preserve stdout stderr and signal-state evidence with exclusive outputs; distinguish graceful exit abnormal exit timeout escalation and uncertain cleanup.","Bound startup and termination waits, reap owned children, and never treat forced termination as a successful recorder result.","Use synthetic local recorder processes only for all execution and tests; do not open a capture interface or contact any instrument or network endpoint.","Maintain Click to delegate to library composition for any public entrypoint; keep legacy recorder scripts byte-identical."],"acceptance":["Synthetic controls establish signal normalization and explicit failure outcomes without physical access."],"required_extensions":[],"extensions":{},"verification":["contract","controls","isolation"]}
