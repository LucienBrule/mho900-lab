{"protocol":"tasking/core-draft-2","id":"TASK.bench.first-contact-passive-boot","title":"Observe separately confirmed Ethernet and first power transitions passively","state":"open","intent":"Preserve first controlled boot evidence without supplying network services or changing specimen configuration.","requires":["TASK.bench.first-contact-host-preparation"],"requirements":["Wait for explicit Ethernet-only confirmation, record the transition and check carrier and capture health before the prescribed power-only handoff. Do not infer physical transitions from elapsed time.","Wait for explicit power confirmation and then timestamp carrier and specimen-originated traffic. Preserve full raw capture and classify observed protocols without answering traffic or actively querying services.","Request operator photographs or transcription for visible boot and UI information; do not infer firmware, options, stable UI or prompts from network silence.","Stop for unexpected behavior or any requirement to change persistent state. No DHCP service, management address, discovery, scans, SCPI, ADB, Web Control, USB connection or storage insertion is admitted.","Preserve a reasonable passive interval and immutable phase artifacts with hashes; keep observation, inference and operator reports distinct."],"acceptance":["Confirmed physical transitions and passive first-boot observations are preserved or an explicit stop condition is documented."],"required_extensions":[],"extensions":{},"verification":["transitions","capture","observations","limits"]}
