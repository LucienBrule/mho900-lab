{"protocol":"tasking/core-draft-2","id":"TASK.rf.factory-point-trial","title":"Test one factory point frame after a coordinated source power cycle","state":"closed","intent":"Determine whether the delivered source accepts the recovered 100 MHz point path while preserving its stock controller.","requires":["TASK.rf.factory-point-sender"],"requirements":["Revalidate the identified USB-UART device and absence of another port user. Coordinate exactly one operator power cycle of the RF source, retaining the same USB connection topology, both SMA ports empty, LCD ribbon intact and no programmer attached.","Record operator confirmation of the restored stable source screen and port identity before writing. Stop on unexpected startup, identity or UI state instead of guessing a new command.","Attempt exactly one frame 55 55 00 64 00 00 00 0D 0A at 115200 baud 8N1 with raw power zero. No cleanup bytes, retry, alternative baud, sweep, reset command, firmware change, RF connection or oscilloscope contact.","Preserve raw request, pre-input, response, write intent, transport result and timestamped screen witness in a fresh sealed run. A complete host write and silence alone are not device acceptance.","The command may save ordinary source frequency settings in EEPROM. Do not add a persistence power cycle, restoration command or second setting to this trial. Close the observed question even if the desired display change does not occur."],"acceptance":["One bounded trial or a justified pre-write stop is preserved with its physical transitions and limits."],"required_extensions":[],"extensions":{},"verification":["preconditions","transitions","transcript","witness","preservation"]}
