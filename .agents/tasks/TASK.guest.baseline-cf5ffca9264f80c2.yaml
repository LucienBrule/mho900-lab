{"protocol":"tasking/core-draft-2","id":"TASK.guest.baseline","title":"Capture the stock APK baseline result on the pinned guest","state":"closed","intent":"Produce repeated clean-state boot and APK admission evidence, capturing the earliest reached failure.","requires":["TASK.guest.inputs"],"requirements":["Use disposable guest state, the pinned runtime and image, and the byte-identical stock APK.","Do not alter the APK, guest signing policy, identity data, or hardware behavior to bypass a baseline failure.","No physical device access, host restart, invasive host configuration, or unrelated task work.","Preserve raw local logs and publish only reviewed evidence with private paths and identifiers removed."],"acceptance":["Attempt two runs from separate clean writable states with recorded commands, bounds, and timestamps.","Record emulator exit or timeout, ADB reachability, boot completion, API/ABI and graphics where reached.","If boot succeeds, capture ordinary APK installation; if admitted, attempt the declared launch activity.","Record signing identity, package-manager errors, logs, process state and screenshots where accessible.","Classify each phase as reached, failed, timed out, or not reached with evidence locators and digests.","Explain reproducibility or any divergent outcomes; an unexplained failure alone does not satisfy closure.","A reproducible negative result satisfies the investigation but never constitutes application readiness."],"required_extensions":[],"extensions":{},"verification":["run-one","run-two","outcome-classification","input-preservation"]}
