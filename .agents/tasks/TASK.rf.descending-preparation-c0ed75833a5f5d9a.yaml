{"protocol":"tasking/core-draft-2","id":"TASK.rf.descending-preparation","title":"Prepare an exploratory six GHz descending stock and derived sweep","state":"open","intent":"Answer the operator's broad reception question without substituting a calibrated bandwidth claim.","requires":["TASK.rf.binary-supplied-reader-decision"],"requirements":["Preserve the failed original matched comparison and all previous survey evidence. This is a distinct exploratory experiment authorized by the operator; no new record fills the original seventy-five comparison slots or changes their acceptance rules.","Freeze an existing-coax CH1 fifty-ohm, DC, one-times, zero-offset, FULL, normal acquisition profile with original ordinary/export restoration. Start the descending sweep at nominal six GHz in each verified stock or derived software arm, followed by a finite descending list including one GHz and eight hundred MHz. Use raw source power zero, at most one exact factory command per scheduled visit, validate all frames offline including the receiver's CR delimiter exclusion, and preserve one hundred MHz return commands and every weak, constant, partial or negative result.","Use complete original RAW ASCII volts, adjacent preambles, reported sample interval and whole-record AC RMS. Require complete finite correctly framed records and no overload; do not require a command-frequency peak or minimum amplitude above Nyquist. Report commanded frequency separately from sampled components and predicted aliases under the reported sample clock. No uncalibrated absolute bandwidth or patch-causality claim follows from this exploratory survey.","Reuse the isolated Linux namespace and conventional SCPI/ADB sockets with fresh full capture, recorded ownership, no external route, gateway, DNS, forwarding or duplicate helpers. Scope and source remain on the existing wiring. Pin source serial identity, exact stock and derived byte provenance, current software epoch, protected corpus and the existing bounded policy reader. Native selection uses only the established reversible standalone library mechanism and one normal reboot per transition; preserve the stock APK and protected options/calibration. Prepare conditional root readiness, captured lease renewal and graceful recorder/drop/owned-helper retirement before execution.","Prepare a finite run budget and explicit known-safe stock rollback/restoration reserve. Do not borrow expired authorization timestamps or original A1/B/A2 admission. Perform focused host-only controls and independent preparation review. Preparation may inspect preserved files and Linux host state but does not contact the specimen, start physical controllers or write the source. Commit and push the preparation conclusion before contact."],"acceptance":["A bounded exploratory descending protocol and executable preparation or an exact implementation blocker is preserved."],"required_extensions":[],"extensions":{},"verification":["protocol","source_frames","aliased_observation","software_transition","ownership_cleanup","independent_review"]}
