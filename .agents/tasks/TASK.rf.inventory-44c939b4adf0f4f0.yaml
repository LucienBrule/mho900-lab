{"protocol":"tasking/core-draft-2","id":"TASK.rf.inventory","title":"Reconcile available lab capabilities for the first RF comparison","state":"open","intent":"Establish which required capabilities exist on the bench and which remain ordered or unknown.","requires":["TASK.specimen.rf-evaluation-ready"],"requirements":["Use existing private evidence and operator reports without contacting hardware. Distinguish ordered, delivered, on-hand, inspected and qualified equipment with dated attribution.","Cover measurement instruments, source/reference options, boards, SMA/BNC cables and adapters, terminations, attenuators, power and waveform export. Record usable ranges, calibration status and unknowns.","Keep receipts, BOMs, detailed inventory, unit identifiers and private paths out of tracked source. Retain a local TOML capability inventory under ignored out/rf and publish only generic constraints if useful.","Identify the minimum first-comparison kit, optional improvements and missing facts worth asking the operator. Do not make the crash cart, arriving SDRs or custom clock firmware automatic prerequisites."],"acceptance":["A dated private inventory distinguishes actual availability from expectations and lists the specific gaps that affect a first RF experiment."],"required_extensions":[],"extensions":{},"verification":["inventory","evidence_status","capability_gaps"]}
