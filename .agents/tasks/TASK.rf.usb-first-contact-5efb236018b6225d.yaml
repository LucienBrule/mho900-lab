{"protocol":"tasking/core-draft-2","id":"TASK.rf.usb-first-contact","title":"Observe source startup and identify its USB serial interface","state":"open","intent":"Establish a usable source control transport while RF and MCLK remain isolated from the instrument.","requires":["TASK.rf.source-research"],"requirements":["Follow docs/research/rf-source-usb-first-contact.md. The operator requested a choice between USB first power and further disassembly and prefers USB control. Instruct only the isolated source connection described in that procedure.","Preserve a private timestamped host USB registry and serial-node baseline before connection. After operator confirmation, compare the same views to identify the new interface by device identity and topology rather than a guessed serial path.","Record the operator's first screen, visible settings and startup/output indication without equating UI state with measured RF. Keep the LCD ribbon intact, both SMA ports unconnected, and the physical scope untouched.","This task performs host registry inspection only. Do not open serial ports, send command bytes, install drivers, operate programming or calibration facilities, modify firmware or connect an RF path.","Retain raw before/after evidence privately and seal it. A missing device or unstable boot is a valid negative result; stop for a bounded decision instead of improvising further intervention."],"acceptance":["Source startup and USB/serial availability are evidenced, or a specific first-contact failure is preserved."],"required_extensions":[],"extensions":{},"verification":["host_baseline","startup","usb_identity","evidence_seal"]}
