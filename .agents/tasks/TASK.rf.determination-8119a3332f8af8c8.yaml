{"protocol":"tasking/core-draft-2","id":"TASK.rf.determination","title":"Determine the RF result and the smallest justified continuation","state":"open","intent":"Resolve the milestone from observed response rather than software labels or a desired outcome.","requires":["TASK.rf.reduce"],"requirements":["Evaluate the frozen hypotheses and controls. Classify policy effect as demonstrated, not resolved at stated sensitivity, contrary to the proposed increase, or unassessable because controls failed.","Separately classify the absolute target as met, missed, inconclusive or not assessed. Distinguish a selected-point result from continuous bandwidth or full instrument certification.","State whether the RF milestone is answered, requires a bounded follow-up or is operator-deferred. A closed task graph is not automatically a positive RF result.","For unresolved questions identify the exact uncertainty and minimum additional observation. Admit at most one small successor batch when justified and authorized, with plan inspection, expected revision, explicit roadmap membership and committed tasking before execution.","Preserve negative experiments and prior hypotheses; do not continue by changing the same completed run. Commit and push the scoped report and taskctl receipts, leaving a clean checkpoint."],"acceptance":["The evidence supports an explicit milestone disposition and either a scoped conclusion or the next smallest justified question."],"required_extensions":[],"extensions":{},"verification":["finding","claim_scope","milestone_disposition","continuation"]}
