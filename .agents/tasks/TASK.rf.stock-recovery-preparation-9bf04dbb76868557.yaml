{"protocol":"tasking/core-draft-2","id":"TASK.rf.stock-recovery-preparation","title":"Prepare one operator-assisted stock power-cycle recovery","state":"open","intent":"Test a fresh stock boot after the completed negative ADB session without changing software selection.","requires":["TASK.rf.sparrow-liveness-decision"],"requirements":["Bind the operator authorization for one manual scope power cycle and current report that the normal scope UI displays RF on CH1. This is an operator observation, not a PID-bound native or waveform witness. Preserve all five prerequisite-only failures and the responsive one-query SCPI diagnostic.","Prepare a separate fresh full-capture and isolated 86400-second DHCP coordinator. Positively identify owned processes and freeze exact control sources. Before the operator transition confirmation, provide no management connection and no temporary host IPv4 address. Publish readiness only after host isolation, actual capture writing and graceful recorder control are verified. Never infer a power cycle from silence or link activity.","Require one explicit normal power cycle in two operator-confirmed steps: normal shutdown with screen-dark confirmation, then a durable power-on-ready cue and one start confirmation. Require a fresh matching DHCP REQUEST/ACK after the power-on-ready cue before postboot observation; that ACK may precede the operator reply. Never mistake confirmation-message latency for missing negotiation. Permit an expected old-lease release only within the explicit transition window before that new ACK. No DHCP gateway, DNS, forwarding, NAT, bridge or external route. No source command, new wiring, native deployment/removal, firmware flash, entitlement or calibration operation.","Reuse the proved foreground owned ADB lifetime, precise library/mapping/epoch checks, protected-content comparison and existing fixed stock observer. Bound one initial connection; if service health fails, stop without another reset or unchanged connect retry. Permit at most the original single bounded postboot adb-root setup if a verified shell UID requires it for the existing observer; record intent and daemon restart, verify UID afterward, and never remount or change persistent daemon properties.","Keep exact stock hashes, current protected baseline, new boot/process identity, stock 17/17 witness, current normal UI acceptance and greater than 1800 seconds serviced warm-up. Independently review deterministic gates, exact source, lease chronology and cleanup before root executes. Plan and commit preparation before physical contact. Retain the original RF contract and hard deadline 2026-10-03T01:38:03Z with sufficient remaining-sequence reserve."],"acceptance":["One independently reviewed recovery coordinator is frozen or explicitly held."],"required_extensions":[],"extensions":{},"verification":["authority","source","controls","preservation"]}
