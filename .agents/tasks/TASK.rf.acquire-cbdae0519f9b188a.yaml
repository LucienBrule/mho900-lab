{"protocol":"tasking/core-draft-2","id":"TASK.rf.acquire","title":"Execute one frozen RF comparison and preserve its raw evidence","state":"open","intent":"Observe the physical response under verified software arms without extending the experiment after seeing its result.","requires":["TASK.rf.execution-decision","TASK.rf.transport-deregistration-decision"],"requirements":["Revalidate the accepted go conditions and current bench/software state, then execute only the frozen operator-authorized protocol. Preserve stock originals and calibration/identity/option invariants.","Retain raw waveforms/preambles, actual settings, source/reference observations, software hash/policy checks, timestamps/environment and drift anchors for each arm. Retain raw management traffic and recorder statistics where used.","Stop at unexpected state change, overload, acquisition/capture failure or failed arm verification. Preserve partial runs; perform only authorized cleanup/recovery and document the final software, source and host state.","Seal each run separately with hashes. Do not erase failed attempts, add ad-hoc points, change the hypothesis or repeat until a desired outcome appears. Commit and push a sanitized acquisition conclusion before a new experiment.","Preserve the three prerequisite-only A1 stops. Require the independently reviewed ordinary impedance, exact isolated-host transport and bounded local removal remedies before a fresh attempt; neither changes the 75-slot hypothesis or permits retrying a failed metadata or waveform read. Restore the captured original impedance and settings only while framing remains healthy."],"acceptance":["One completed or explicitly aborted protocol execution has sealed evidence","a recorded final state and enough attribution for offline evaluation."],"required_extensions":[],"extensions":{},"verification":["run_seal","arm_evidence","protocol_adherence","final_state"]}
