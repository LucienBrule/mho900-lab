{"protocol":"tasking/core-draft-2","id":"TASK.rf.integration","title":"Validate the approved signal path and waveform acquisition procedure","state":"closed","intent":"Establish that the bench can produce interpretable data for the selected question.","requires":["TASK.rf.source-accession"],"requirements":["Proceed only with a source suitable for the selected question and an operator-authorized integration procedure. Reconcile any accession shortfall first; membership or task closure is not a go decision.","Verify the specified 50-ohm path, level budget, connectors, acquisition settings and actual sample rate at approved pilot settings. Preserve setup observations, source conditions and scaling metadata.","Demonstrate complete waveform export with preamble, record length and sample interval. Validate recorder lifecycle/drop statistics wherever network capture is used; preserve host isolation and restoration evidence.","Label all pilot records; do not treat them as confirmation data or make unplanned software transitions. Preserve calibration, identity, license and stock originals, and stop on unexpected state or acquisition failure.","Reuse existing tooling and manual controls. A demonstrated blocker may justify separately admitted minimal tooling, but not an automatic crash-cart or source-controller project."],"acceptance":["Retained pilot evidence establishes the acquisition path and its limits, or precisely identifies the integration failure without claiming comparative RF results."],"required_extensions":[],"extensions":{},"verification":["procedure_authority","path","waveform_export","pilot_outcome"]}
