{"protocol":"tasking/core-draft-2","id":"TASK.bench.adb-inventory","title":"Establish read-only specimen ADB inventory","state":"closed","intent":"Discover physical OS, privilege, storage layout and installed software paths before acquisition.","requires":["TASK.bench.stage-two-b1-known-background"],"requirements":["Commit tasking before execution. Pin offline endpoint evidence; use one candidate ADB endpoint under fresh full capture and host isolation, retaining known host-local background.","Do not run adb root, approve authentication, change device settings, reboot or attach USB. Stop if ordinary access requires these changes or if recorder/isolation fails.","Collect id, getprop, partitions, block nodes and by-name mapping, mounts, processes/listeners, rigol metadata, APK paths and package versions. Do not assume a block-device name or interpret unreadable data as absent.","Preserve private raw output, exact command status and timestamps; restore temporary host state and seal capture with graceful statistics and hashes. Respect lease expiry; renewal requires operator authorization."],"acceptance":["An observed read-only inventory or precise access blocker is preserved."],"required_extensions":[],"extensions":{},"verification":["endpoint","access","inventory","preservation"]}
