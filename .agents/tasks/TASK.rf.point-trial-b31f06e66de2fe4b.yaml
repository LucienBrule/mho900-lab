{"protocol":"tasking/core-draft-2","id":"TASK.rf.point-trial","title":"Send one isolated 100 MHz source command and observe the result","state":"open","intent":"Test candidate command interpretation without contacting the oscilloscope or qualifying RF.","requires":["TASK.rf.point-sender"],"requirements":["Use the approved source-only USB scope and docs/research/rf-source-usb-control-decision.md. Require an unchanged stable pre-command UI report and both SMA ports empty; leave the LCD ribbon and instrument untouched.","Revalidate the previously observed target's USB VID/PID, registry identity/topology and serial path immediately before execution. Stop on mismatch, disconnect or unexpected input rather than choosing a new target automatically.","Attempt exactly one 100 MHz point command with nominal 25 MHz reference and candidate power code 4. Preserve raw pre-input, requested/transmitted bytes, returned bytes, error/close outcomes and local/UTC timestamps. Any partial or uncertain result stops the run without retry.","Request a post-command screen witness and record display/boot behavior separately from transport facts. Preserve unknown RF level, frequency accuracy, mute and persistence; no scope connection or power cycle.","Seal the trial, retain a negative result if present and commit/push the conclusion before any successor experiment."],"acceptance":["One bounded command attempt or a specific pre-write stop is evidenced, with operator screen observation where the command was sent."],"required_extensions":[],"extensions":{},"verification":["preflight","transcript","observation","evidence_seal"]}
