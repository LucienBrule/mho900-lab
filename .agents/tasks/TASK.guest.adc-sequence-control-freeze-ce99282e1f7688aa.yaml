{"protocol":"tasking/core-draft-2","id":"TASK.guest.adc-sequence-control-freeze","title":"Build and freeze a whole ADC sequence observer with private controls","state":"open","intent":"Validate complete predicted access sequences with normal execution between device accesses and a post-routine stop.","requires":["TASK.guest.adc-whole-sequence-gate"],"requirements":["Preserve existing completed experiments and stock artifacts. Add a distinct observer mode and new output binaries; bind the whole ADC candidate and reviewed static provenance. Do not repin or rerun old frozen profiles.","Before continuation require matching relocation bindings and relevant typed entry state. Do not compare relocated pointer bytes as if stable across process instances. Log and reject unexpected entry values before executing the ADC routine.","At the mapped boundary check every predicted W32 offset and value and both R32 positions. Use two explicitly synthetic logging readbacks, chip0 ready-bit set with low16 0x1234 and chip1 ready-bit clear with zero. These are software protocol controls and carry no actual FPGA claim.","Run stock instructions normally between mapped accesses. Stop on first mismatch, unsupported access, unexpected signal, deadline or unsupported thread transition. Preserve normal exclusive sequences and place the final precise stop at the confirmed caller PC0x333bac before its instruction executes.","Make thread scheduling and coverage explicit. Track the whole thread group and new threads, reject unsupported mapped access from other threads, and demonstrate in a private control that an ordinary worker dependency can complete. Do not silently obtain progress by freezing a needed worker.","Design a bounded private control set that independently checks complete sequence, changed operand, reordered or omitted access, unknown read, wrong terminal PC, entry mismatch, helper readback branches, second-thread access, clone coverage, deadline and uninterrupted atomic progress before the final breakpoint.","Freeze sources binary profiles runner indexing final-health behavior and independent verifiers before any guest control run. Exercise actual production indexing with all newly declared nested inputs. Commit and push implementation and freeze before execution."],"acceptance":["A complete independently checked observer and frozen private suite or a precise architecture limitation is committed and pushed."],"required_extensions":[],"extensions":{},"verification":["observer","entry","threads","controls","freeze"]}
