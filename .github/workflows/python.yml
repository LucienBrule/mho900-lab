name: Typed Python workspace

on:
  push:
    paths:
      - "packages/**"
      - "examples/sealed-review/**"
      - "docs/runbooks/**"
      - ".gitattributes"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "tools/check-python*.sh"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "packages/**"
      - "examples/sealed-review/**"
      - "docs/runbooks/**"
      - ".gitattributes"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "tools/check-python*.sh"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12.13"
          - os: macos-latest
            python: "3.12.10"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.6.17"
      - name: Locked typed quality checks
        run: ./tools/check-python.sh
      - name: Built distribution controls
        run: |
          mkdir -p out/tooling
          ./tools/check-python-packages.sh out/tooling/installed-packages
