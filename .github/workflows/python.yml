name: Typed Python workspace

on:
  push:
    paths:
      - "packages/**"
      - "examples/sealed-review/**"
      - "docs/runbooks/**"
      - ".gitattributes"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "tools/check-python*.sh"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "packages/**"
      - "examples/sealed-review/**"
      - "docs/runbooks/**"
      - ".gitattributes"
      - "pyproject.toml"
      - "uv.lock"
      - ".python-version"
      - "tools/check-python*.sh"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12.13"
          - os: macos-latest
            python: "3.12.10"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.6.17"
          prune-cache: true
      - name: Locked typed quality checks
        run: ./tools/check-python.sh
      - name: Built distribution controls
        run: |
          mkdir -p out/tooling
          ./tools/check-python-packages.sh out/tooling/installed-packages
